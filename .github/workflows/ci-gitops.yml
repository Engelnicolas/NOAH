name: CI - GitOps

on:
  push:
    branches: [main, develop]
    paths:
      - 'gitops/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'gitops/**'

jobs:
  validate:
    name: YAML lint, kubeconform, and Helm dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: gitops/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              comments:
                min-spaces-from-content: 1
            ignore: |
              gitops/clusters/production/flux-system/gotk-components.yaml

      - name: Kubeconform
        run: |
          find gitops/ -name '*.yaml' \
            ! -name '*.enc.yaml' \
            ! -name 'gotk-components.yaml' \
            | xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.30.0

      - name: Helm dry-run (HelmRelease manifests)
        run: |
          errors=0
          while IFS= read -r f; do
            helm template test "$f" --dry-run 2>&1 | grep -i "error" && errors=$((errors+1)) || true
          done < <(find gitops/ -name 'helmrelease.yaml')
          [ "$errors" -eq 0 ] || exit 1
