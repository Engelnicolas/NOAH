---
- name: NOAH Complete Stack Deployment (Standalone)
  hosts: localhost
  gather_facts: yes
  vars:
    cluster_name: "{{ cluster_name | default('noah-cluster') }}"
    domain_name: "{{ domain_name | default('noah-infra.com') }}"
    validation_mode: "{{ validation_mode | default('production') }}"  # validation modes: production (default) or development
    strict_development_validation: "{{ strict_development_validation | default(false) }}"  # dev-only hard fail toggle
    verbose_mode: true  # Enable verbose output by default
    # Use raw numbers to avoid self-referential recursion; allow override via --extra-vars
    cilium_wait_timeout: 300   # seconds (override with -e cilium_wait_timeout=900)
    authentik_rollout_timeout: 300  # seconds (override with -e authentik_rollout_timeout=900)
    enable_hubble: true  # default enable Hubble in production
    hubble_tls_enabled: true
    authentik_helm_timeout: "300s"  # override with -e authentik_helm_timeout=900s
    
  tasks:
    - name: "CONFIGURATION: Load environment variables from encrypted config"
      ansible.builtin.shell: |
        # Load encrypted configuration and export variables
        cd {{ playbook_dir | dirname }}
        python3 Scripts/cluster_create/export_env_vars.py
        echo "NOAH_ROOT_DIR={{ playbook_dir | dirname }}"
        echo "ANSIBLE_PLAYBOOK_DIR=./Ansible"
      register: env_vars
      changed_when: false
      
    - name: "CONFIGURATION: Set environment variables as facts"
      ansible.builtin.set_fact:
        noah_root_dir: "{{ env_vars.stdout_lines | select('match', '^NOAH_ROOT_DIR=') | first | regex_replace('^NOAH_ROOT_DIR=', '') }}"
        ansible_playbook_dir: "{{ env_vars.stdout_lines | select('match', '^ANSIBLE_PLAYBOOK_DIR=') | first | regex_replace('^ANSIBLE_PLAYBOOK_DIR=', '') }}"

    - name: "Execute complete NOAH stack deployment"
      block:
        - name: "PHASE 1: Deployment validation and preparation"
          block:
            - name: Display deployment configuration
              ansible.builtin.debug:
                msg: |
                  === NOAH STANDALONE IAM DEPLOYMENT ===
                  Cluster Name: {{ cluster_name }}
                  Domain: {{ domain_name }}
                  Deployment Mode: Standalone IAM
                  Order: Cilium → Authentik
                  ======================================
            
            - name: Validate required variables
              ansible.builtin.fail:
                msg: "Required variable {{ item }} is not defined"
              when: vars[item] is not defined or vars[item] == ""
              loop:
                - cluster_name
                - domain_name
            
            - name: Check if cluster is accessible
              ansible.builtin.shell: |
                # Development mode: Skip actual cluster checks
                echo "✓ Development mode: Skipping cluster connectivity check"
                echo "✓ Cluster connectivity simulated successfully"
                exit 0
              register: cluster_check
              failed_when: cluster_check.rc != 0
          
          tags: [validation]
        
        - name: "PHASE 2: Deploy Cilium CNI (Network Foundation)"
          block:
            - name: Record Cilium phase start time
              ansible.builtin.set_fact:
                phase_cilium_started: "{{ ansible_date_time.epoch | int }}"

            - name: Deploy Cilium CNI with SSO-ready configuration
              ansible.builtin.command: >-
                ansible-playbook deploy-cilium.yml
                -e namespace=kube-system
                -e domain_name="{{ domain_name }}"
                -e deployment_phase=complete
                -e enable_hubble=true
                -e hubble_tls_enabled=true
              args:
                chdir: "{{ playbook_dir }}"
              register: cilium_subplay
              failed_when: cilium_subplay.rc != 0
              vars:
                cilium_namespace: kube-system
                domain_name: "{{ domain_name }}"
                deployment_phase: complete
                enable_hubble: true
                hubble_tls_enabled: true

            - name: Validate Cilium deployment (development shortcut)
              ansible.builtin.debug:
                msg:
                  - "✓ Development mode: Skipping real Cilium validation"
                  - "✓ Hubble (simulated) → hubble.{{ domain_name }}"
              when: validation_mode is defined and validation_mode == 'development'

            - name: Wait for Cilium pods Ready (production)
              kubernetes.core.k8s_info:
                kind: Pod
                namespace: kube-system
                label_selectors:
                  - k8s-app=cilium
              register: cilium_pods
              until: cilium_pods.resources | length > 0 and (cilium_pods.resources | map(attribute='status.containerStatuses') | map('first') | selectattr('ready') | list | length) == (cilium_pods.resources | length)
              retries: "{{ (cilium_wait_timeout | int // 5) | int }}"
              delay: 5
              when: validation_mode != 'development'

            - name: Check Cilium operator rollout (production)
              kubernetes.core.k8s_info:
                kind: Deployment
                name: cilium-operator
                namespace: kube-system
              register: cilium_operator
              failed_when: false
              when: validation_mode != 'development'

            - name: Wait for Cilium operator available (production)
              ansible.builtin.command: >-
                kubectl rollout status deploy/cilium-operator -n kube-system --timeout={{ cilium_wait_timeout }}s
              register: cilium_operator_rollout
              changed_when: false
              failed_when: cilium_operator_rollout.rc != 0
              when: validation_mode != 'development' and (cilium_operator.resources | length) > 0

            - name: Check Hubble UI service presence (production)
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Service
                name: hubble-ui
                namespace: kube-system
              register: hubble_ui_service
              failed_when: false
              when: validation_mode != 'development' and enable_hubble | bool

            - name: Record Cilium phase end time
              ansible.builtin.set_fact:
                phase_cilium_ended: "{{ ansible_date_time.epoch | int }}"
          
          tags: [cilium, networking]
        
        - name: "PHASE 3: Deploy Authentik SSO (Standalone IAM)"
          block:
            - name: Record Authentik phase start time
              ansible.builtin.set_fact:
                phase_authentik_started: "{{ ansible_date_time.epoch | int }}"
            - name: Deploy Authentik SSO standalone
              ansible.builtin.command: >-
                ansible-playbook deploy-authentik.yml
                -e authentik_namespace=identity
                -e domain_name="{{ domain_name }}"
                -e authentik_helm_timeout={{ authentik_helm_timeout }}
              args:
                chdir: "{{ playbook_dir }}"
              register: authentik_subplay
              failed_when: authentik_subplay.rc != 0
              vars:
                authentik_namespace: identity
                domain_name: "{{ domain_name }}"

            - name: Validate Authentik deployment (development shortcut)
              ansible.builtin.debug:
                msg:
                  - "✓ Development mode: Skipping Authentik rollout validation"
                  - "✓ IAM URL (simulated): https://auth.{{ domain_name }}"
              when: validation_mode is defined and validation_mode == 'development'

            - name: Wait for Authentik server rollout (production)
              ansible.builtin.command: >-
                kubectl rollout status deploy/authentik-server -n identity --timeout={{ authentik_rollout_timeout }}s
              register: authentik_server_rollout
              changed_when: false
              failed_when: authentik_server_rollout.rc != 0
              when: validation_mode != 'development'

            - name: Wait for Authentik worker rollout (production if exists)
              ansible.builtin.command: >-
                kubectl rollout status deploy/authentik-worker -n identity --timeout={{ authentik_rollout_timeout }}s
              register: authentik_worker_rollout
              changed_when: false
              failed_when: authentik_worker_rollout.rc != 0
              when: validation_mode != 'development' and (lookup('ansible.builtin.pipe', 'kubectl get deploy/authentik-worker -n identity --no-headers 2>/dev/null | wc -l') | int) > 0

            - name: Probe Authentik health endpoint (best-effort)
              ansible.builtin.shell: |
                POD=$(kubectl get pods -n identity -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$POD" ]; then
                  kubectl exec -n identity "$POD" -- curl -sf http://localhost:9000/-/health/ready/ >/dev/null 2>&1 && echo "READY" || echo "NOT_READY"
                else
                  echo "NO_POD"
                fi
              register: authentik_health_probe
              retries: 20
              delay: 10
              until: authentik_health_probe.stdout == 'READY'
              failed_when: false
              when: validation_mode != 'development'

            - name: Record Authentik phase end time
              ansible.builtin.set_fact:
                phase_authentik_ended: "{{ ansible_date_time.epoch | int }}"

            - name: Check TLS secret presence (production)
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                name: authentik-tls
                namespace: identity
              register: authentik_tls_secret
              failed_when: false
              when: validation_mode != 'development'

            - name: Report TLS secret status (production)
              ansible.builtin.debug:
                msg: >-
                  {{ '✓ TLS secret authentik-tls present' if (authentik_tls_secret.resources | length) > 0 else '⚠️  TLS secret authentik-tls not found yet' }}
              when: validation_mode != 'development'

            - name: DNS resolution for auth.<domain> with retry (production)
              ansible.builtin.shell: |
                set -o pipefail
                host auth.{{ domain_name }} 2>/dev/null | grep -E "has address|domain name pointer" || echo "NO_DNS"
              register: auth_dns_lookup
              changed_when: false
              failed_when: false
              retries: 12            # Up to ~3 minutes (12 * 15s)
              delay: 15
              until: auth_dns_lookup.stdout is defined and auth_dns_lookup.stdout != 'NO_DNS'
              when: validation_mode != 'development'

            - name: Display DNS readiness (production)
              ansible.builtin.debug:
                msg: >-
                  {{ '✓ DNS resolution for auth.' + domain_name + ' successful' if (auth_dns_lookup.stdout is defined and auth_dns_lookup.stdout != 'NO_DNS') else '⚠️  DNS for auth.' + domain_name + ' not resolving after retries' }}
              when: validation_mode != 'development'
          
          tags: [authentik, iam]
        
        - name: "PHASE 4: Post-deployment validation"
          block:
            - name: Record final validation phase start
              ansible.builtin.set_fact:
                phase_validation_started: "{{ ansible_date_time.epoch | int }}"

            - name: Validate complete deployment stack
              ansible.builtin.shell: |
                echo "=== COMPREHENSIVE DEPLOYMENT HEALTH CHECK ==="
                echo "Deployment order: Cilium → Authentik"
                echo ""
                
                echo "🔍 PHASE 1: Pod Readiness Check"
                echo "--------------------------------"
                echo "Checking Cilium CNI pods..."
                cilium_count=$(kubectl get pods -n kube-system -l k8s-app=cilium --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
                echo "✓ Cilium: $cilium_count pods running"
                
                echo "Checking CoreDNS pods..."
                coredns_count=$(kubectl get pods -n kube-system -l k8s-app=kube-dns --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
                echo "✓ CoreDNS: $coredns_count pods running"
                
                echo "Checking Authentik IAM pods..."
                authentik_server_count=$(kubectl get pods -n identity -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=server --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
                authentik_worker_count=$(kubectl get pods -n identity -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=worker --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
                echo "✓ Authentik: Server=$authentik_server_count, Worker=$authentik_worker_count pods ready"
                
                echo ""
                echo "🔍 PHASE 2: Service Health Check"
                echo "--------------------------------"
                
                echo "Checking Authentik health endpoint..."
                authentik_pod=$(kubectl get pods -n identity -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=server --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                if [[ -n "$authentik_pod" ]]; then
                  if kubectl exec -n identity "$authentik_pod" -- curl -sf http://localhost:9000/-/health/ready/ >/dev/null 2>&1; then
                    echo "✓ Authentik health endpoint: responding"
                  else
                    echo "⚠️  Authentik health endpoint: not ready yet (normal during startup)"
                  fi
                else
                  echo "⚠️  Authentik health endpoint: no server pods found"
                fi
                
                echo "Checking PostgreSQL connectivity..."
                postgres_pod=$(kubectl get pods -n identity -l app.kubernetes.io/name=postgresql --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                if [[ -n "$postgres_pod" ]]; then
                  if kubectl exec -n identity "$postgres_pod" -- pg_isready -h localhost >/dev/null 2>&1; then
                    echo "✓ PostgreSQL: accepting connections"
                  else
                    echo "⚠️  PostgreSQL: not accepting connections yet"
                  fi
                else
                  echo "⚠️  PostgreSQL: no running pods found"
                fi
                
                echo "Checking Redis connectivity..."
                redis_pod=$(kubectl get pods -n identity -l app.kubernetes.io/name=redis,app.kubernetes.io/component=master --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                if [[ -n "$redis_pod" ]]; then
                  if kubectl exec -n identity "$redis_pod" -- redis-cli ping 2>/dev/null | grep -q "PONG"; then
                    echo "✓ Redis: responding to ping"
                  else
                    echo "⚠️  Redis: not responding to ping yet"
                  fi
                else
                  echo "⚠️  Redis: no running master pods found"
                fi
                
                echo ""
                echo "🔍 PHASE 3: Network Connectivity Check"
                echo "--------------------------------------"
                
                echo "Checking service endpoints..."
                authentik_endpoints=$(kubectl get endpoints -n identity authentik-server -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | wc -w)
                if [[ "$authentik_endpoints" -gt 0 ]]; then
                  echo "✓ Authentik service: $authentik_endpoints endpoints available"
                else
                  echo "⚠️  Authentik service: no endpoints yet (may still be starting)"
                fi
                
                echo "Checking DNS resolution..."
                if kubectl run dns-test --image=busybox --rm -it --restart=Never -- nslookup kubernetes.default >/dev/null 2>&1; then
                  echo "✓ DNS resolution: working"
                else
                  echo "⚠️  DNS resolution: test inconclusive (normal for test environment)"
                fi
                
                echo ""
                echo "📊 VALIDATION SUMMARY"
                echo "====================="
                
                # Check if critical services are running
                if [[ "$cilium_count" -gt 0 && "$coredns_count" -gt 0 && "$authentik_server_count" -gt 0 ]]; then
                  echo "🎉 DEPLOYMENT SUCCESSFUL!"
                  echo "✓ Cilium CNI: Network foundation ready"
                  echo "✓ Authentik IAM: Identity provider ready"
                  echo "✓ All critical components are running"
                else
                  echo "⚠️  DEPLOYMENT COMPLETED WITH WARNINGS"
                  echo "Some services may still be starting up."
                fi
                
                echo ""
                echo "🌐 Access points:"
                echo "  - Authentik IAM: https://auth.{{ domain_name }}"
                echo "  - Hubble UI: https://hubble.{{ domain_name }}"
              register: validation_output
              tags: validation
              
            - name: Record final validation phase end
              ansible.builtin.set_fact:
                phase_validation_ended: "{{ ansible_date_time.epoch | int }}"

            - name: Display health check results
              ansible.builtin.debug:
                msg: "{{ validation_output.stdout_lines }}"
              tags: validation

            - name: Collect critical component readiness metrics
              ansible.builtin.shell: |
                set -euo pipefail
                json_escape() { echo "$1" | sed 's/"/\\"/g'; }
                cilium=$(kubectl get pods -n kube-system -l k8s-app=cilium --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l | tr -d ' ')
                coredns=$(kubectl get pods -n kube-system -l k8s-app=kube-dns --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l | tr -d ' ')
                authentik_server=$(kubectl get pods -n identity -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=server --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l | tr -d ' ')
                authentik_endpoints=$(kubectl get endpoints -n identity authentik-server -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | wc -w | tr -d ' ')
                printf '{"cilium":%s,"coredns":%s,"authentik_server":%s,"authentik_endpoints":%s}\n' "${cilium:-0}" "${coredns:-0}" "${authentik_server:-0}" "${authentik_endpoints:-0}"
              register: critical_readiness_raw
              changed_when: false
              failed_when: false
              tags: validation

            - name: Parse critical readiness JSON
              ansible.builtin.set_fact:
                critical_readiness: "{{ (critical_readiness_raw.stdout | default('{}')) | from_json }}"
              when: critical_readiness_raw.stdout is defined and critical_readiness_raw.stdout | length > 0
              tags: validation

            - name: Derive list of missing critical components
              ansible.builtin.set_fact:
                critical_missing: >-
                  {{ []
                     + (['cilium'] if (critical_readiness.cilium | default(0) | int) == 0 else [])
                     + (['coredns'] if (critical_readiness.coredns | default(0) | int) == 0 else [])
                     + (['authentik_server'] if (critical_readiness.authentik_server | default(0) | int) == 0 else [])
                  }}
              when: critical_readiness is defined
              tags: validation

            - name: Show missing critical components (development mode only)
              ansible.builtin.debug:
                msg: >-
                  ⚠️  Development validation: missing critical components → {{ critical_missing | join(', ') }} (deployment not failed automatically)
              when: validation_mode == 'development' and not strict_development_validation | bool and critical_missing is defined and (critical_missing | length) > 0
              tags: validation

            - name: Fail if critical components absent (production or strict dev)
              ansible.builtin.fail:
                msg: >-
                  Critical components missing: {{ critical_missing | join(', ') }}. Deployment failed due to failed readiness criteria.
              when: (validation_mode == 'production' or strict_development_validation | bool) and critical_missing is defined and (critical_missing | length) > 0
              tags: validation

            - name: Display phase duration summary
              ansible.builtin.debug:
                msg: |
                  === PHASE DURATIONS (seconds) ===
                  Cilium Phase: {{ (phase_cilium_ended | int) - (phase_cilium_started | int) if (phase_cilium_started is defined and phase_cilium_ended is defined) else 'n/a' }}
                  Authentik Phase: {{ (phase_authentik_ended | int) - (phase_authentik_started | int) if (phase_authentik_started is defined and phase_authentik_ended is defined) else 'n/a' }}
                  Validation Phase: {{ (phase_validation_ended | int) - (phase_validation_started | int) if (phase_validation_started is defined and phase_validation_ended is defined) else 'n/a' }}
                  Total (Cilium + Authentik + Validation): {{ ((phase_cilium_ended | int) - (phase_cilium_started | int) + (phase_authentik_ended | int) - (phase_authentik_started | int) + (phase_validation_ended | int) - (phase_validation_started | int)) if (phase_cilium_ended is defined and phase_authentik_ended is defined and phase_validation_ended is defined) else 'n/a' }}
              when: phase_cilium_ended is defined

            - name: Fail fast if any phase failed (production)
              ansible.builtin.fail:
                msg: "One or more deployment phases failed. See earlier logs for details."
              when: (deployment_phase_failed | default(false)) and validation_mode == 'production'
          
          tags: [validation, final]

      rescue:
        - name: Deployment failure handler
          ansible.builtin.debug:
            msg: |
              === NOAH DEPLOYMENT FAILED ===
              
              The deployment encountered an error. Check the following:
              1. Cluster connectivity: kubectl cluster-info
              2. Pod status: kubectl get pods --all-namespaces
              3. Recent events: kubectl get events --sort-by=.metadata.creationTimestamp
              4. Service logs: kubectl logs -n identity deployment/<service-name>
              
              For troubleshooting:
              - python noah.py status --all
              - python noah.py test sso
              
              To retry specific phases:
              - ansible-playbook Ansible/cluster-deploy.yml --tags=cilium
              - ansible-playbook Ansible/cluster-deploy.yml --tags=samba4  
              - ansible-playbook Ansible/cluster-deploy.yml --tags=authentik
        - name: Set failure flag
          ansible.builtin.set_fact:
            deployment_phase_failed: true
      always:
        - name: Display success banner (only if no failure)
          ansible.builtin.debug:
            msg: |
              🎉 NOAH standalone IAM deployment successful!
              All requested components completed without fatal errors.
          when: 
            - not (deployment_phase_failed | default(false))
            - not (critical_missing is defined and (critical_missing | length) > 0)

        - name: Force non-zero exit on failure (development & production)
          ansible.builtin.fail:
            msg: "Deployment failed (one or more phases). See logs above."
          when: deployment_phase_failed | default(false)
        
