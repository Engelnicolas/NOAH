---
- name: Deploy Authentik SSO (Standalone)
  hosts: localhost
  gather_facts: no
  vars:
    authentik_namespace: "identity"
    verbose_mode: true  # Enable verbose output by default
    ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python"
    authentik_helm_timeout: "600s"

  environment:
    PYTHONPATH: "{{ playbook_dir }}/../.venv/lib/python3.12/site-packages:{{ ansible_env.PYTHONPATH | default('') }}"
    
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        name: "{{ authentik_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Export canonical Authentik secrets (script)
      command: >-
        python3 {{ playbook_dir }}/../Scripts/security/export_canonical_service.py --service authentik
      register: authentik_canonical_output
      changed_when: false

    - name: Parse canonical Authentik secrets
      set_fact:
        _raw_lines: "{{ authentik_canonical_output.stdout.split('\n') | reject('equalto','') | list }}"
      changed_when: false

    - name: Extract JSON payload line
      set_fact:
        _json_line: "{{ _raw_lines[-1] if (_raw_lines | length) > 0 else '' }}"
      changed_when: false

    - name: Fail if JSON payload missing or not a mapping
      ansible.builtin.fail:
        msg: "Canonical secrets export did not produce JSON on last line"
      when: _json_line | length == 0 or not (_json_line is mapping)

    - name: Convert canonical JSON to fact
      set_fact:
        authentik_canonical: "{{ _json_line }}"
      changed_when: false

    - name: Create/Update Authentik Kubernetes Secret from canonical store
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authentik-secret
            namespace: "{{ authentik_namespace }}"
          type: Opaque
          stringData:
            AUTHENTIK_SECRET_KEY: "{{ authentik_canonical.secret_key }}"
            AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ authentik_canonical.bootstrap_password }}"
            AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_canonical.bootstrap_token }}"
            AUTHENTIK_POSTGRESQL__PASSWORD: "{{ authentik_canonical.postgresql_password }}"
            postgresql-password: "{{ authentik_canonical.postgresql_password }}"
            AUTHENTIK_REDIS__PASSWORD: "{{ authentik_canonical.redis_password }}"
            redis-password: "{{ authentik_canonical.redis_password }}"
            secret-key: "{{ authentik_canonical.secret_key }}"
            bootstrap-password: "{{ authentik_canonical.bootstrap_password }}"
            bootstrap-token: "{{ authentik_canonical.bootstrap_token }}"
      register: authentik_secret_apply

    - name: Find TLS certificate file for domain
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../Certificates"
        patterns: "*{{ domain_name | default('noah-infra.com') }}.crt"
      register: tls_cert_files

    - name: Find TLS key file for domain
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../Certificates"
        patterns: "*{{ domain_name | default('noah-infra.com') }}.key"
      register: tls_key_files

    - name: Warn if TLS certificate files not found (cert-manager will provision TLS)
      ansible.builtin.debug:
        msg: >-
          No local TLS certificate found for {{ domain_name | default('noah-infra.com') }}.
          cert-manager will provision the authentik-tls secret automatically via the
          letsencrypt-prod cluster-issuer annotation on the ingress.
      when: (tls_cert_files.matched == 0) or (tls_key_files.matched == 0)

    - name: Create TLS secret for Authentik ingress (local cert)
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authentik-tls
            namespace: "{{ authentik_namespace }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', tls_cert_files.files[0].path) | b64encode }}"
            tls.key: "{{ lookup('file', tls_key_files.files[0].path) | b64encode }}"
      register: authentik_tls_secret_apply
      when: tls_cert_files.matched > 0 and tls_key_files.matched > 0

    - name: Report Authentik secret status
      debug:
        msg: >-
          Authentik secret {{ 'created/updated' if authentik_secret_apply.changed else 'is up-to-date' }} via canonical store

    - name: Report TLS secret status
      debug:
        msg: >-
          TLS secret {{ 'created/updated' if authentik_tls_secret_apply.changed else 'is up-to-date' }} for ingress
      when: authentik_tls_secret_apply is defined

    - name: Create Authentik values file for Helm deployment
      copy:
        content: |
          # Authentik standalone IAM configuration
          authentik:
            secret_key: ""  # Will be set from secrets
            bootstrap:
              password: ""  # Will be set from secrets
              token: ""     # Will be set from secrets
            postgresql:
              enabled: false  # Use external PostgreSQL
              host: "postgresql.{{ authentik_namespace }}.svc.cluster.local"
              port: 5432
              name: "authentik"
              user: "authentik"
              password: ""  # Will be set from secrets
            redis:
              enabled: false  # Use external Redis
              host: "redis.{{ authentik_namespace }}.svc.cluster.local"
              port: 6379
              password: ""  # Will be set from secrets
            ldap:
              enabled: false  # LDAP disabled for standalone OIDC mode
              bindPassword: ""  # Empty for standalone mode
            email:
              password: ""  # Will be set from secrets if needed
          
          # External PostgreSQL configuration
          postgresql:
            enabled: true
            auth:
              postgresPassword: "{{ authentik_canonical.postgresql_password }}"
              username: "authentik"
              password: "{{ authentik_canonical.postgresql_password }}"
              database: "authentik"
            primary:
              persistence:
                enabled: false  # Use emptyDir for testing
                storageClass: ""
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          
          # External Redis configuration
          redis:
            enabled: true
            auth:
              enabled: true
              password: "{{ authentik_canonical.redis_password }}"
            master:
              persistence:
                enabled: false  # Use emptyDir for testing
                storageClass: ""
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
            replica:
              persistence:
                enabled: false  # Use emptyDir for testing
                storageClass: ""
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          
          # Ingress configuration for external access
          ingress:
            enabled: true
            className: "nginx"  # Use nginx ingress controller
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              nginx.ingress.kubernetes.io/proxy-body-size: "50m"
              nginx.ingress.kubernetes.io/configuration-snippet: |
                more_set_headers "Access-Control-Allow-Origin: *";
                more_set_headers "Access-Control-Allow-Methods: GET, POST, OPTIONS";
                more_set_headers "Access-Control-Allow-Headers: Authorization, Content-Type";
            hosts:
              - host: "auth.{{ domain_name | default('noah-infra.com') }}"
                paths:
                  - path: /
                    pathType: Prefix
                  - path: /application/o/
                    pathType: Prefix
                  - path: /.well-known/
                    pathType: Prefix
            tls:
              - secretName: authentik-tls
                hosts:
                  - "auth.{{ domain_name | default('noah-infra.com') }}"
          
          # TLS configuration
          tls:
            enabled: true
            secretName: "authentik-tls"
          
          # Global domain configuration for dynamic FQDN
          global:
            domain: "{{ domain_name | default('noah-infra.com') }}"
          
          # Service configuration  
          service:
            subdomain: "auth"
            fqdn: "auth.{{ domain_name | default('noah-infra.com') }}"
            port: 9000
          
          # Server configuration
          server:
            service:
              type: ClusterIP
            replicas: 1
          
          # Worker configuration  
          worker:
            replicas: 1
        dest: /tmp/authentik-values.yaml

    - name: Adopt existing secrets for Helm (if present)
      ansible.builtin.shell: >-
        kubectl patch secret {{ item }} -n {{ authentik_namespace }} --type merge -p '{
          "metadata": {
            "labels": {"app.kubernetes.io/managed-by": "Helm"},
            "annotations": {
              "meta.helm.sh/release-name": "authentik",
              "meta.helm.sh/release-namespace": "{{ authentik_namespace }}"
            }
          }
        }' 2>/dev/null || true
      changed_when: false
      loop:
        - authentik-secret
        - authentik-tls

    - name: Deploy Authentik using Helm
      ansible.builtin.command: >-
        helm upgrade --install authentik {{ playbook_dir }}/../Helm/authentik
        --namespace {{ authentik_namespace }}
        --values /tmp/authentik-values.yaml
        --timeout {{ authentik_helm_timeout }}
        {{ '--dry-run' if (dry_run | default(false)) else '' }}
      register: authentik_helm_result
      failed_when: authentik_helm_result.rc != 0

    - name: Set deployment status based on validation
      set_fact:
        authentik_deployment_status: "{{ 'VALIDATED' if authentik_helm_result.rc == 0 else 'FAILED' }}"
        authentik_validation_status: "{{ 'SUCCESS - Standalone IAM configured' if authentik_helm_result.rc == 0 else 'FAILED' }}"

    - name: Display Authentik deployment status
      debug:
        msg:
          - "Authentik deployment validated for namespace: {{ authentik_namespace }}"
          - "Access URL: http://authentik.{{ authentik_namespace }}.svc.cluster.local"
          - "Bootstrap user: akadmin"
          - "Deployment status: {{ authentik_deployment_status }}"
          - "Validation status: {{ authentik_validation_status }}"
          - "Helm dry-run: {{ 'SUCCESS' if authentik_helm_result.rc == 0 else 'FAILED' }}"

    - name: Confirm bootstrap token is present in canonical secrets store
      ansible.builtin.command: >-
        python3 {{ playbook_dir }}/../Scripts/security/export_canonical_service.py --service authentik
      register: authentik_token_confirm
      changed_when: false
      failed_when: authentik_token_confirm.rc != 0

    - name: Verify bootstrap token exported from canonical store
      ansible.builtin.set_fact:
        _token_check_line: >-
          {{ (authentik_token_confirm.stdout.split('\n') | reject('equalto','') | list)[-1] | default('') }}
      changed_when: false

    - name: Fail if bootstrap token is absent in canonical store
      ansible.builtin.fail:
        msg: "AUTHENTIK_BOOTSTRAP_TOKEN is missing from the canonical secrets store. Re-run security initialization."
      when: >-
        _token_check_line | length == 0
        or not (_token_check_line is mapping)
        or (_token_check_line.bootstrap_token | default('') == '')

    - name: Report bootstrap token persistence status
      ansible.builtin.debug:
        msg: "✓ AUTHENTIK_BOOTSTRAP_TOKEN confirmed in canonical secrets store"

    - name: Validate Authentik standalone IAM deployment summary
      debug:
        msg:
          - "=== AUTHENTIK STANDALONE IAM DEPLOYMENT SUMMARY ==="
          - "✓ Namespace: {{ authentik_namespace }}"
          - "✓ Secrets: authentik-secret (canonical-managed)"
          - "✓ Bootstrap token: confirmed in canonical store"
          - "✓ Helm Chart: {{ playbook_dir }}/../Helm/authentik"
          - "✓ PostgreSQL: External dependency configured"
          - "✓ Redis: External dependency configured"
          - "✓ IAM Mode: Standalone (No external LDAP)"
          - "✓ Authentication: Internal user database"
          - "✓ Validation: {{ authentik_validation_status }}"
          - "✅ Ready for standalone IAM operations"
