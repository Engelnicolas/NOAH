---
- name: Deploy cert-manager for TLS certificate management
  hosts: localhost
  gather_facts: no
  vars:
    cert_manager_namespace: cert-manager
    cert_manager_version: "v1.17.2"
    cert_manager_helm_timeout: "300s"
    letsencrypt_email: "{{ letsencrypt_email | default('admin@noah-infra.com') }}"
    domain_name: "{{ domain_name | default('noah-infra.com') }}"
    ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python"

  environment:
    PYTHONPATH: "{{ playbook_dir }}/../.venv/lib/python3.12/site-packages:{{ ansible_env.PYTHONPATH | default('') }}"

  tasks:
    - name: Add cert-manager Helm repository
      kubernetes.core.helm_repository:
        name: cert-manager
        repo_url: https://charts.jetstack.io
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update cert-manager
      changed_when: false
      failed_when: false

    - name: Create cert-manager namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cert_manager_namespace }}"
            labels:
              name: "{{ cert_manager_namespace }}"
              app.kubernetes.io/managed-by: noah
        state: present

    - name: Deploy cert-manager via Helm (installs CRDs)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: cert-manager/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_namespace: "{{ cert_manager_namespace }}"
        create_namespace: true
        values:
          installCRDs: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          webhook:
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
          cainjector:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 256Mi
        wait: true
        wait_timeout: "{{ cert_manager_helm_timeout }}"
      register: cert_manager_result

    - name: Wait for cert-manager webhook to be ready
      ansible.builtin.command: >-
        kubectl rollout status deploy/cert-manager-webhook
        -n {{ cert_manager_namespace }}
        --timeout=120s
      changed_when: false
      retries: 3
      delay: 10
      register: webhook_rollout
      until: webhook_rollout.rc == 0

    - name: Create letsencrypt-prod ClusterIssuer
      kubernetes.core.k8s:
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: "{{ letsencrypt_email }}"
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: nginx
        state: present

    - name: Create letsencrypt-staging ClusterIssuer (for testing)
      kubernetes.core.k8s:
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: https://acme-staging-v02.api.letsencrypt.org/directory
              email: "{{ letsencrypt_email }}"
              privateKeySecretRef:
                name: letsencrypt-staging-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: nginx
        state: present

    - name: Verify ClusterIssuers created
      ansible.builtin.command: kubectl get clusterissuer letsencrypt-prod letsencrypt-staging
      changed_when: false
      register: issuer_check
      retries: 5
      delay: 5
      until: issuer_check.rc == 0

    - name: Display cert-manager deployment summary
      ansible.builtin.debug:
        msg:
          - "✓ cert-manager {{ cert_manager_version }} deployed"
          - "✓ ClusterIssuer 'letsencrypt-prod' created (email: {{ letsencrypt_email }})"
          - "✓ ClusterIssuer 'letsencrypt-staging' created (for testing)"
          - "Note: HTTP-01 challenge requires DNS records to resolve to the server IP"
          - "Note: Certificates will be provisioned automatically when ingresses are created"
