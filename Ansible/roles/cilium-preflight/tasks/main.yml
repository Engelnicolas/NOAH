---
# NOAH role: cilium-preflight
# Installs Cilium CNI before Flux bootstrap to break the chicken-and-egg:
# Flux controllers need pod networking to start, but Cilium is managed by Flux.
# This installs a minimal Cilium so Flux pods can run; Flux then reconciles
# the full HelmRelease (idempotent upgrade with Hubble, ingressController, etc.).

- name: Check whether cilium CLI is already installed
  stat:
    path: /usr/local/bin/cilium
  register: cilium_cli_binary

- name: Install cilium CLI
  shell: |
    set -euo pipefail
    CILIUM_CLI_VERSION=$(curl -fsSL https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    curl -fsSL --remote-name-all \
      "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"
    tar xzvf cilium-linux-amd64.tar.gz -C /usr/local/bin cilium
    rm cilium-linux-amd64.tar.gz
  args:
    executable: /bin/bash
  when: not cilium_cli_binary.stat.exists

- name: Check whether Cilium is already installed in the cluster
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
      kubectl get helmrelease cilium -n kube-system 2>/dev/null || \
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
      kubectl get daemonset cilium -n kube-system 2>/dev/null
  register: cilium_installed
  changed_when: false
  failed_when: false

- name: Install minimal Cilium CNI (bootstrap pass — Flux upgrades to full config later)
  shell: |
    set -euo pipefail
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml cilium install \
      --set kubeProxyReplacement=true \
      --set k8sServiceHost="{{ node1_ip }}" \
      --set k8sServicePort=6443 \
      --set operator.replicas=1 \
      --set hubble.enabled=false
  args:
    executable: /bin/bash
  when: cilium_installed.rc != 0

- name: Wait for Cilium to be ready
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml cilium status --wait --wait-duration 5m
  args:
    executable: /bin/bash
  register: cilium_status
  retries: 3
  delay: 10
  until: cilium_status.rc == 0
  changed_when: false
