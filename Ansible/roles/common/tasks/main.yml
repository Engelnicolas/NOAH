---
# NOAH role: common
# OS-level prerequisites for K3s nodes (Ubuntu 22.04+ assumed).

- name: Refresh apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages required by K3s + helpers
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - jq
      - iptables
      - socat
      - conntrack
      - ebtables
      - apparmor
      - apparmor-utils
      - python3-kubernetes
    state: present

- name: Disable swap (required by Kubernetes scheduler)
  shell: |
    swapoff -a
    sed -ri 's/^([^#].*\sswap\s.*)$/# \1/g' /etc/fstab
  args:
    executable: /bin/bash
  changed_when: false

- name: Load kernel modules required by Cilium / kube-proxy
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Persist kernel modules across reboots
  copy:
    dest: /etc/modules-load.d/noah-k3s.conf
    mode: '0644'
    content: |
      br_netfilter
      overlay

- name: Apply sysctl tuning for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/99-noah-k3s.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
  notify: reload sysctl

- name: Set timezone to UTC (consistent etcd timestamps)
  timezone:
    name: UTC
