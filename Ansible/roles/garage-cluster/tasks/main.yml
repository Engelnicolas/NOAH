---
# NOAH role: garage-cluster
#
# Forms the cluster. Sequence confirmed upstream (§6):
#   garage node id
#     → garage node connect <id>@<addr>
#     → garage layout assign <short-id> -z <zone> -c <capacity>
#     → garage layout show
#     → garage layout apply
#
# Runs on the FIRST Garage node only (`run_once`): the layout is cluster-wide
# state, and assigning it from every node in parallel is how a layout version
# ends up applied twice with different contents.
#
# Buckets and keys are NOT here. They belong to garage_provision.py, because
# the keys are generated by NOAH and imported into Garage (§6.2, G2) — the
# credentials must reach the canonical store before they reach a machine.

- name: Read this node's Garage identifier
  command: "{{ garage_binary_path }} node id -q"
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  register: garage_node_id
  changed_when: false
  # The id embeds no secret — it is a public key fingerprint plus an address —
  # but the command reads a config file that does, so keep the output narrow.
  no_log: false

- name: Publish the node identifier as a fact
  set_fact:
    garage_full_node_id: "{{ garage_node_id.stdout | trim }}"

- name: Connect every node to the first one
  # `node connect` is idempotent: reconnecting an already-known peer is a no-op.
  command: >-
    {{ garage_binary_path }} node connect
    {{ hostvars[item].garage_full_node_id }}
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  loop: "{{ groups['garage_nodes'] }}"
  when: item != inventory_hostname
  run_once: true
  changed_when: false
  register: garage_connect
  until: garage_connect is succeeded
  retries: 3
  delay: 5

- name: Read the current layout
  command: "{{ garage_binary_path }} layout show"
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  register: garage_layout_before
  run_once: true
  changed_when: false

- name: Assign each node its zone and capacity
  # -z is the GARAGE zone (site-a / site-b), a placement label internal to
  # Garage. It has nothing to do with the cloud availability zone, which is
  # single by construction (G18): an EBS volume is bound to its zone and a
  # stopped Spot instance restarts in its own, so spreading the machines would
  # break G11 in silence.
  command: >-
    {{ garage_binary_path }} layout assign
    {{ hostvars[item].garage_full_node_id.split('@')[0] }}
    -z {{ hostvars[item].garage_zone }}
    -c {{ hostvars[item].garage_capacity }}
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  loop: "{{ groups['garage_nodes'] }}"
  run_once: true
  changed_when: true

- name: Show the staged layout
  command: "{{ garage_binary_path }} layout show"
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  register: garage_layout_staged
  run_once: true
  changed_when: false

- name: Report the staged layout
  debug:
    var: garage_layout_staged.stdout_lines
  run_once: true

- name: Apply the layout
  # The version number comes from the line `layout show` prints for exactly
  # this purpose ("garage layout apply --version N"), NOT from any "version N"
  # in the output: the first such match is "Current cluster layout version",
  # and applying THAT number fails. When no changes are staged the line is
  # absent, and a re-run must then be a no-op rather than an error — which is
  # what makes `garage deploy` replayable.
  shell: |
    set -euo pipefail
    version=$({{ garage_binary_path }} layout show \
      | grep -oE 'layout apply --version[[:space:]]+[0-9]+' \
      | grep -oE '[0-9]+$' | tail -1)
    if [ -z "${version}" ]; then
      echo "NOAH: no staged layout change"
      exit 0
    fi
    {{ garage_binary_path }} layout apply --version "${version}"
  args:
    executable: /bin/bash
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  register: garage_layout_apply
  run_once: true
  changed_when: "'no staged layout change' not in (garage_layout_apply.stdout | default(''))"

- name: Wait for the cluster to converge
  command: "{{ garage_binary_path }} status"
  environment:
    GARAGE_CONFIG_FILE: /etc/garage/garage.toml
  register: garage_status
  run_once: true
  changed_when: false
  retries: 12
  delay: 5
  until: >-
    garage_status.rc == 0 and
    (garage_status.stdout_lines | select('search', 'NO ROLE|UNAVAILABLE') | list | length) == 0

- name: Report the cluster status
  debug:
    var: garage_status.stdout_lines
  run_once: true
