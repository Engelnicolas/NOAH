---
# NOAH role: k3s-validate
# Sanity checks that block the bootstrap if the control plane is not
# in a usable state. Failing here is preferable to failing later when
# FluxCD tries to reconcile against a half-broken cluster.

- name: Wait for kube-apiserver to accept requests
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get --raw=/healthz
  register: apiserver_health
  retries: 30
  delay: 5
  until: apiserver_health.rc == 0
  changed_when: false

- name: Wait for nodes to register with the API server
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
      kubectl get nodes --no-headers | wc -l
  register: registered_nodes
  retries: 24
  delay: 10
  until: (registered_nodes.stdout | trim | int) >= (expected_node_count | int)
  changed_when: false

- name: Fail if registered node count is below expectation
  fail:
    msg: >-
      Expected at least {{ expected_node_count }} registered node(s),
      got {{ registered_nodes.stdout | trim }}.
      Check that K3s started correctly: journalctl -u k3s -n 50
  when: (registered_nodes.stdout | trim | int) < (expected_node_count | int)

- name: Show node readiness state (informational — nodes become Ready after Cilium is deployed by Flux)
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes --no-headers
  register: node_list
  changed_when: false
  failed_when: false

- name: List etcd members (HA only — non-fatal in single-node)
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
      kubectl -n kube-system get pods -l component=etcd \
        -o jsonpath='{.items[*].metadata.name}'
  register: etcd_pods
  changed_when: false
  failed_when: false

- name: Show validation summary
  debug:
    msg:
      - "API server: healthy"
      - "Registered nodes: {{ registered_nodes.stdout | trim }} / {{ expected_node_count }}"
      - "Node status (NotReady is expected until Cilium is deployed by Flux):"
      - "{{ node_list.stdout }}"
      - "etcd pods:  {{ etcd_pods.stdout | default('(none — single-node embedded etcd is in-process)') }}"
