apiVersion: v2
name: authentik
description: A Helm chart for Authentik - Standalone OIDC Identity Provider
type: application

version: 0.1.0
appVersion: "2025.09"

dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.13.4"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
