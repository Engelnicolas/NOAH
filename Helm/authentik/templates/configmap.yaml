{{- $serviceFqdn := .Values.service.fqdn -}}
{{- $globalDomain := .Values.global.domain | default "noah-infra.com" -}}
{{- $serviceSubdomain := .Values.service.subdomain | default "auth" -}}
{{- $computedFqdn := printf "%s.%s" $serviceSubdomain $globalDomain -}}
{{- $finalFqdn := $serviceFqdn | default $computedFqdn -}}
{{- $baseDomain := .Values.service.domain | default $globalDomain -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authentik.fullname" . }}-config
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
    noah.infra.com/service: authentik
    noah.infra.com/managed-by: configloader
  annotations:
    noah.infra.com/fqdn: {{ $finalFqdn | quote }}
    noah.infra.com/domain: {{ $baseDomain | quote }}
data:
  oidc-config.yaml: |
    {{- if .Values.authentik.oidc.enabled }}
    oidc_providers:
      - name: "Kubernetes Cluster OIDC"
        client_id: {{ .Values.authentik.oidc.clientId | quote }}
        issuer_url: {{ .Values.authentik.oidc.issuerUrl | default (printf "https://%s/application/o/kubernetes/" $finalFqdn) | quote }}
        authorization_flow: "default-authentication-flow"
        redirect_uris:
          - "http://localhost:8080"
          - {{ printf "https://kubernetes.%s/oauth/callback" $baseDomain | quote }}
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        property_mappings:
          - "authentik default OIDC Mapping: OpenID 'sub'"
          - "authentik default OIDC Mapping: OpenID 'email'"
          - "authentik default OIDC Mapping: OpenID 'email_verified'"
          - "authentik default OIDC Mapping: OIDC Groups Claim"
    {{- end }}
  
  bootstrap-config.yaml: |
    bootstrap:
      admin_user: {{ .Values.authentik.bootstrap.adminUser | quote }}
      admin_email: {{ .Values.authentik.bootstrap.adminEmail | default (printf "admin@%s" $baseDomain) | quote }}
      
  app-config.yaml: |
    # Authentik application configuration
    server:
      listen:
        - "0.0.0.0:9000"
      cookie_domain: {{ printf ".%s" $baseDomain | quote }}
      cookie_secure: true
    
    logging:
      level: {{ .Values.authentik.logLevel | quote }}
      
    email:
      {{- if .Values.authentik.email }}
      host: {{ .Values.authentik.email.host | default (printf "smtp.%s" $baseDomain) | quote }}
      port: {{ .Values.authentik.email.port }}
      username: {{ .Values.authentik.email.username | quote }}
      use_tls: {{ .Values.authentik.email.useTls }}
      use_ssl: {{ .Values.authentik.email.useSSL }}
      from: {{ .Values.authentik.email.from | quote }}
      {{- end }}
