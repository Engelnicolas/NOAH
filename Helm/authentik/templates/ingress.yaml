{{- if .Values.ingress.enabled -}}
{{/*
Multi-controller ingress for Authentik SSO with dynamic domain support
Supports: nginx, cilium, traefik
Current: {{ .Values.ingress.className | default "nginx" }}
Dynamic domain management via ConfigLoader integration
*/}}
{{- $serviceFqdn := .Values.service.fqdn -}}
{{- $globalDomain := .Values.global.domain | default "" -}}
{{- $serviceSubdomain := .Values.service.subdomain | default "auth" -}}
{{- $computedFqdn := printf "%s.%s" $serviceSubdomain $globalDomain -}}
{{- $finalFqdn := $serviceFqdn | default $computedFqdn -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "authentik.fullname" . }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
    noah.infra.com/service: authentik
    noah.infra.com/managed-by: configloader
  annotations:
    # Dynamic domain management
    noah.infra.com/fqdn: {{ $finalFqdn | quote }}
    noah.infra.com/domain-source: {{ if $serviceFqdn }}"configloader"{{ else }}"static"{{ end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq .Values.ingress.className "cilium" }}
    # Cilium-specific annotations for SSO
    cilium.io/ssl-redirect: "true"
    cilium.io/lb-algorithm: "round_robin"
    cilium.io/service-mesh: "true"
    cilium.io/proxy-read-timeout: "300s"
    cilium.io/proxy-send-timeout: "300s"
    cilium.io/cors-enable: "true"
    cilium.io/cors-allow-origin: "*"
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if or .Values.ingress.tls .Values.tls.enabled }}
  tls:
    {{- if .Values.ingress.tls }}
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
    {{- else if .Values.tls.enabled }}
    - hosts:
        - {{ $finalFqdn | quote }}
      secretName: {{ .Values.tls.secretName | default "authentik-tls" }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "authentik.fullname" $ }}-server
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
    {{- else }}
    # Dynamic host configuration using computed FQDN
    - host: {{ $finalFqdn | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "authentik.fullname" . }}-server
                port:
                  number: {{ .Values.service.port }}
          - path: /application/o/
            pathType: Prefix
            backend:
              service:
                name: {{ include "authentik.fullname" . }}-server
                port:
                  number: {{ .Values.service.port }}
          - path: /.well-known/
            pathType: Prefix
            backend:
              service:
                name: {{ include "authentik.fullname" . }}-server
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
{{- end }}
