replicaCount: 1

image:
  repository: ghcr.io/goauthentik/server
  tag: "2023.10.5"
  pullPolicy: IfNotPresent

worker:
  replicaCount: 1

# ConfigLoader Integration - Dynamic Domain Management
# These values can be set by ConfigLoader for dynamic domain management
global:
  domain: ""                    # Set by ConfigLoader or default to noah-infra.com
  cluster_name: ""              # Set by ConfigLoader
  environment: ""               # Set by ConfigLoader (dev/staging/production)
  namespace: ""                 # Set by ConfigLoader
  noah:
    managed: false              # Set to true when managed by ConfigLoader
    version: ""                 # Set by ConfigLoader

service:
  type: LoadBalancer            # External access for OIDC endpoints
  port: 80                      # HTTP port
  httpsPort: 443                # HTTPS port
  # Dynamic service configuration - set by ConfigLoader
  name: "authentik"             # Service name
  subdomain: "auth"             # Default subdomain, can be overridden
  domain: ""                    # Specific domain override (NOAH_AUTHENTIK_DOMAIN)
  fqdn: ""                      # Full FQDN, computed by ConfigLoader
  annotations:
    # Use Cilium's LoadBalancer with external access
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
    # Dynamic hostname annotation - will be updated by template
    external-dns.alpha.kubernetes.io/hostname: "auth.noah-infra.com"
    # Configure load balancing algorithm
    service.cilium.io/lb-algorithm: "round_robin"

# TLS Configuration - can be managed by ConfigLoader
tls:
  enabled: true                 # Enable TLS by default
  secretName: "authentik-tls"   # Default TLS secret name

ingress:
  enabled: true                 # Enable ingress for OIDC endpoints
  className: cilium             # Options: "nginx", "cilium", or "traefik"
  annotations:
    # Common annotations for all ingress controllers
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Nginx-specific (when className: nginx)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # OIDC-specific headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Access-Control-Allow-Origin: *";
      more_set_headers "Access-Control-Allow-Methods: GET, POST, OPTIONS";
      more_set_headers "Access-Control-Allow-Headers: Authorization, Content-Type";
  
  # Static host configuration (used when ConfigLoader values are not provided)
  # These will be ignored if service.fqdn or computed FQDN is available
  hosts: []
  # Example static configuration:
  # hosts:
  #   - host: auth.noah-infra.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #       - path: /application/o/
  #         pathType: Prefix
  #       - path: /.well-known/
  #         pathType: Prefix
  
  tls: []
  # Example static TLS configuration:
  # tls:
  #   - secretName: authentik-tls
  #     hosts:
  #       - auth.noah-infra.com

authentik:
  # Use our existing secret instead of auto-generating
  secret:
    existingSecret: "authentik-secrets"
    secretKey: "AUTHENTIK_SECRET_KEY"
  errorReporting:
    enabled: false
  logLevel: info
  # OIDC Provider Configuration
  oidc:
    enabled: true
    issuerUrl: "https://auth.noah-infra.com/application/o/kubernetes/"
    clientId: "kubernetes-cluster"
    # Client secret will be generated and stored in kubernetes secret
  email:
    host: smtp.noah-infra.com
    port: 587
    username: ""
    password: ""
    useTls: true
    useSSL: false
    from: authentik@noah-infra.com
  
  # Standalone IAM Configuration - No external LDAP integration
  bootstrap:
    enabled: true
    adminUser: "akadmin"
    adminEmail: "admin@noah-infra.com"
    
  outposts:
    ldap:
      enabled: false
      replicaCount: 1

postgresql:
  enabled: true
  auth:
    username: authentik
    password: ""  # Will be set from secure secrets
    database: authentik
    existingSecret: "authentik-secrets"
    secretKeys:
      adminPasswordKey: "postgresql-password"
      userPasswordKey: "postgresql-password"
  primary:
    persistence:
      enabled: true
      size: 20Gi  # Increased for production OIDC usage
      storageClass: "local-path"  # Use local-path storage class
      accessModes:
        - ReadWriteOnce
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

redis:
  enabled: true
  auth:
    enabled: false  # Disable Redis auth to match current deployment
    password: ""  # Will be set from secure secrets
    existingSecret: "authentik-secrets"
    existingSecretPasswordKey: "redis-password"
  master:
    persistence:
      enabled: true
      size: 4Gi  # Increased for session storage
      storageClass: "local-path"  # Use local-path storage class
      accessModes:
        - ReadWriteOnce
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi

# Persistent Volume for Authentik media files
persistence:
  enabled: true
  size: 5Gi
  storageClass: "local-path"  # Use local-path storage class
  accessMode: ReadWriteOnce
  mountPath: /media

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Security context for production
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# OIDC Integration with Kubernetes
kubernetes:
  oidc:
    enabled: true
    # These will be used to configure kube-apiserver
    issuerUrl: "https://auth.noah-infra.com/application/o/kubernetes/"
    clientId: "kubernetes-cluster"
    usernameClaim: "preferred_username"
    groupsClaim: "groups"
    signingAlgs: ["RS256"]

nodeSelector: {}
tolerations: []
affinity: {}

# Service Monitor for Prometheus (if available)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
