{{- if and .Values.cilium.hubble.ui.enabled .Values.ingress.enabled -}}
{{/*
Cilium Hubble UI Ingress with dynamic domain support
Supports ConfigLoader dynamic domain management
*/}}
{{- $serviceFqdn := .Values.service.fqdn -}}
{{- $globalDomain := .Values.global.domain | default "" -}}
{{- $serviceSubdomain := .Values.service.subdomain | default "hubble" -}}
{{- $computedFqdn := printf "%s.%s" $serviceSubdomain $globalDomain -}}
{{- $finalFqdn := $serviceFqdn | default $computedFqdn -}}
{{- $authFqdn := printf "auth.%s" (.Values.global.domain | default "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cilium.fullname" . }}-hubble-ui
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
    noah.infra.com/service: cilium
    noah.infra.com/component: hubble-ui
    noah.infra.com/managed-by: configloader
  annotations:
    # Dynamic domain management
    noah.infra.com/fqdn: {{ $finalFqdn | quote }}
    noah.infra.com/domain-source: {{ if $serviceFqdn }}configloader{{ else }}static{{ end }}
    # Common ingress annotations
    cert-manager.io/cluster-issuer: {{ "letsencrypt-prod" | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if eq (.Values.ingress.className | default "nginx") "nginx" }}
    # Nginx-specific annotations with dynamic auth URLs
    nginx.ingress.kubernetes.io/auth-url: {{ printf "https://%s/outpost.goauthentik.io/auth/nginx" $authFqdn | quote }}
    nginx.ingress.kubernetes.io/auth-signin: {{ printf "https://%s/outpost.goauthentik.io/start?rd=$escaped_request_uri" $authFqdn | quote }}
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if or .Values.cilium.hubble.ui.ingress.tls .Values.tls.enabled }}
  tls:
    {{- if .Values.cilium.hubble.ui.ingress.tls }}
    {{- range .Values.cilium.hubble.ui.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
    {{- else if .Values.tls.enabled }}
    - hosts:
        - {{ $finalFqdn | quote }}
      secretName: {{ .Values.tls.secretName | default "cilium-tls" }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.cilium.hubble.ui.ingress.hosts }}
    {{- range .Values.cilium.hubble.ui.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
    {{- end }}
    {{- else }}
    # Dynamic host configuration using computed FQDN
    - host: {{ $finalFqdn | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
    {{- end }}
{{- end }}