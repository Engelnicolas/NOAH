{{- if and .Values.lbIpam.enabled .Values.lbIpam.poolCidr }}
# CiliumLoadBalancerIPPool — assigns external IPs to LoadBalancer services on bare-metal.
# On AWS: populate lbIpam.poolCidr with secondary private ENI IPs (e.g. 172.31.x.200/29).
# On bare-metal: use any free IP range on your LAN segment.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: noah-lb-pool
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: noah
    app.kubernetes.io/component: networking
spec:
  blocks:
    - cidr: {{ .Values.lbIpam.poolCidr | quote }}
  allowFirstLastIPs: "Yes"
{{- end }}
