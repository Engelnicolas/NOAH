# NOAH Cilium CNI Configuration
# Configurable domain setup for flexible deployment

# Global NOAH configuration - CUSTOMIZE FOR YOUR ENVIRONMENT
global:
  domain: noah-infra.com  # CHANGE THIS to your domain

# Hubble UI configuration - CUSTOMIZE FOR YOUR ENVIRONMENT  
hubbleUI:
  domain: ""  # If empty, uses global.domain
  subdomain: hubble  # Subdomain for Hubble UI
  # Full domain will be: {subdomain}.{domain or global.domain}

# MetalLB load balancer (disabled by default)
metallb:
  enabled: false

# Enable/disable the Cilium dependency
cilium:
  enabled: true

  # Core Cilium configuration 
  kubeProxyReplacement: true
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6443

  # IPAM configuration
  ipam:
    mode: kubernetes
    
  # Operator configuration
  operator:
    replicas: 1

  # Enable network policy support
  policyEnforcement: default

  # Disable features that might cause conflicts
  l7Proxy: false
  ingressController:
    enabled: false
  gatewayAPI:
    enabled: false
  serviceMesh:
    enabled: false

  # Enhanced Hubble configuration with configurable domain
  hubble:
    enabled: true
    relay:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    ui:
      enabled: true
      backend:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      frontend:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: "noah-ca-issuer"
          # CUSTOMIZE THESE URLs FOR YOUR DOMAIN:
          # Replace "noah-infra.com" with your actual domain
          nginx.ingress.kubernetes.io/auth-url: "https://auth.noah-infra.com/outpost.goauthentik.io/auth/nginx"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth.noah-infra.com/outpost.goauthentik.io/start?rd=$escaped_request_uri"
          nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
          nginx.ingress.kubernetes.io/server-snippet: |
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
        hosts:
          # CUSTOMIZE THIS: Replace "noah-infra.com" with your domain
          - hubble.noah-infra.com
        tls:
          - secretName: hubble-tls
            hosts:
              # CUSTOMIZE THIS: Replace "noah-infra.com" with your domain
              - hubble.noah-infra.com

  # Basic prometheus monitoring (without ServiceMonitor)
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

  # Resource configuration
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi