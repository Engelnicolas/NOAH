# NOAH Cilium CNI Configuration
# Configurable domain setup for flexible deployment
# Enhanced with ConfigLoader dynamic domain management

# ConfigLoader Integration - Dynamic Domain Management
# These values can be set by ConfigLoader for dynamic domain management
global:
  domain: ""                    # Set by ConfigLoader or default to noah-infra.com
  cluster_name: ""              # Set by ConfigLoader
  environment: ""               # Set by ConfigLoader (dev/staging/production)
  namespace: ""                 # Set by ConfigLoader
  noah:
    managed: false              # Set to true when managed by ConfigLoader
    version: ""                 # Set by ConfigLoader

# Service configuration for Hubble UI - supports ConfigLoader values
service:
  name: "cilium"                # Service name
  subdomain: "hubble"           # Default subdomain for Hubble UI
  domain: ""                    # Specific domain override (NOAH_CILIUM_DOMAIN)
  fqdn: ""                      # Full FQDN, computed by ConfigLoader

# TLS Configuration - can be managed by ConfigLoader
tls:
  enabled: true                 # Enable TLS by default
  secretName: "cilium-tls"      # Default TLS secret name

# Ingress configuration for Hubble UI
ingress:
  enabled: true                 # Enable ingress for Hubble UI
  className: "nginx"            # Default to nginx, can be overridden
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# Hubble UI configuration - CUSTOMIZE FOR YOUR ENVIRONMENT  
hubbleUI:
  domain: ""                    # If empty, uses global.domain
  subdomain: hubble             # Subdomain for Hubble UI
  # Full domain will be: {subdomain}.{domain or global.domain}

# MetalLB load balancer (disabled by default)
metallb:
  enabled: false

# Enable/disable the Cilium dependency
cilium:
  enabled: true

  # Core Cilium configuration 
  kubeProxyReplacement: true
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6443

  # IPAM configuration
  ipam:
    mode: kubernetes
    
  # Operator configuration
  operator:
    replicas: 1

  # Enable network policy support
  policyEnforcement: default

  # Disable features that might cause conflicts
  l7Proxy: false
  ingressController:
    enabled: false
  gatewayAPI:
    enabled: false
  serviceMesh:
    enabled: false

  # Enhanced Hubble configuration with configurable domain
  hubble:
    enabled: true
    relay:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    ui:
      enabled: true
      backend:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      frontend:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      ingress:
        enabled: false  # Disabled - using dedicated template instead
        # Note: Ingress configuration moved to dedicated template
        # for dynamic domain management via ConfigLoader
        hosts: []  # Will be populated by ConfigLoader or template defaults
        tls: []    # Will be populated by ConfigLoader or template defaults

  # Basic prometheus monitoring (without ServiceMonitor)
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

  # Resource configuration
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi