# External-DNS Configuration for NOAH
# Automatically manages DNS records for Kubernetes Ingress resources

# Global configuration
global:
  domain: "noah-infra.com"  # Override with --set global.domain=yourdomain.com
  cluster_name: "noah-cluster"
  environment: "production"

# External-DNS configuration
externalDns:
  # Image configuration
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: "v0.14.0"
    pullPolicy: IfNotPresent

  # DNS Provider configuration
  provider: "cloudflare"  # Options: cloudflare, aws, azure, google, digitalocean

  # Domain filters - only manage DNS for these domains
  domainFilters:
    - "noah-infra.com"  # Override with actual domain

  # Zone ID filters (optional, for Cloudflare)
  zoneIdFilters: []  # e.g., ["zone-id-1", "zone-id-2"]

  # Policy for DNS record management
  # sync: Creates, updates, and deletes records
  # upsert-only: Only creates and updates records, never deletes
  policy: "upsert-only"

  # Annotation filter (only process ingresses with this annotation)
  annotationFilter: ""  # Empty means process all ingresses

  # TXT registry configuration
  txtOwnerId: ""  # Auto-generated from cluster name if not set
  txtPrefix: "_external-dns"

  # Sources to watch for DNS records
  sources:
    - ingress
    - service

  # Log configuration
  logLevel: info  # Options: panic, debug, info, warn, error, fatal
  logFormat: text  # Options: text, json

  # Sync interval
  interval: "1m"

  # Trigger loop on pod events
  triggerLoopOnEvent: false

  # Registry type
  registry: "txt"

  # Cloudflare specific configuration
  cloudflare:
    apiToken: ""  # Set via secret
    apiKey: ""    # Legacy auth (not recommended)
    email: ""     # Legacy auth (not recommended)
    proxied: false  # Enable Cloudflare proxy

  # ServiceAccount configuration
  serviceAccount:
    create: true
    name: external-dns
    annotations: {}

  # RBAC configuration
  rbac:
    create: true

  # Resources
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Pod annotations
  podAnnotations: {}

  # Pod labels
  podLabels: {}

  # Deployment strategy
  strategy:
    type: Recreate

  # Extra arguments (advanced)
  extraArgs: []

  # Extra environment variables
  extraEnv: []
