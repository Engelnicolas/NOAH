apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "headlamp.fullname" . }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "headlamp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "headlamp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "headlamp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - "-in-cluster"
          - "-plugins-dir=/headlamp/plugins"
          {{- if .Values.config.baseURL }}
          - "-base-url={{ .Values.config.baseURL }}"
          {{- end }}
        env:
          {{- if .Values.config.oidc.clientID }}
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: headlamp-oidc
                key: clientID
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: headlamp-oidc
                key: clientSecret
          - name: OIDC_ISSUER_URL
            valueFrom:
              secretKeyRef:
                name: headlamp-oidc
                key: issuerURL
          - name: OIDC_SCOPES
            value: {{ .Values.config.oidc.scopes | quote }}
          {{- if .Values.config.oidc.callbackURL }}
          - name: OIDC_CALLBACK_URL
            value: {{ .Values.config.oidc.callbackURL | quote }}
          {{- end }}
          {{- if .Values.config.oidc.useAccessToken }}
          - name: OIDC_USE_ACCESS_TOKEN
            value: "true"
          {{- end }}
          {{- end }}
        ports:
          - name: http
            containerPort: 4466
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: headlamp-cache
            mountPath: /.cache
          {{- if .Values.persistentVolumeClaim.enabled }}
          - name: plugins
            mountPath: /headlamp/plugins
          {{- else }}
          - name: plugins-emptydir
            mountPath: /headlamp/plugins
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: headlamp-cache
          emptyDir: {}
        {{- if .Values.persistentVolumeClaim.enabled }}
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ include "headlamp.fullname" . }}-plugins
        {{- else }}
        - name: plugins-emptydir
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
