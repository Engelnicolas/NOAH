# Headlamp Helm Chart Values
# Kubernetes Web UI with Authentik SSO Integration

replicaCount: 1

image:
  registry: ghcr.io
  repository: headlamp-k8s/headlamp
  pullPolicy: IfNotPresent
  tag: "v0.35.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# OIDC Configuration for Authentik Integration
config:
  oidc:
    # Client ID will be provided by Authentik OAuth2/OIDC provider
    clientID: ""
    # Client secret will be provided by Authentik OAuth2/OIDC provider
    clientSecret: ""
    # Authentik issuer URL: https://auth.<domain>/application/o/headlamp/
    issuerURL: ""
    # OIDC scopes required for authentication
    scopes: "openid profile email groups"
    # Callback URL for OIDC flow
    callbackURL: ""
    # Use access token for API requests
    useAccessToken: false

  # Base URL for Headlamp (used when behind ingress)
  baseURL: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

# Cluster role binding - set to false for better security with OIDC
clusterRoleBinding:
  create: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Headlamp may require larger body sizes for plugin uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: headlamp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.example.com

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Plugin configuration
plugins:
  # List of plugins to install
  # Each plugin can be a URL or git repository
  list: []
  # Auto-update plugins
  autoUpdate: false

# Persistent volume for plugins (optional)
persistentVolumeClaim:
  enabled: false
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
