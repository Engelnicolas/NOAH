[pytest]
addopts = -q -m "not integration and not cluster"
filterwarnings =
    ignore:datetime\.datetime.utcnow\(\) is deprecated:DeprecationWarning
    ignore:PytestReturnNotNoneWarning
markers =
    integration: requires the real sops binary, or mutates the canonical store (excluded from standard CI)
    cluster: requires a live Kubernetes cluster reachable via kubectl (excluded from standard CI)
