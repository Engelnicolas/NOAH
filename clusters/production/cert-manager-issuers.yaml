---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./gitops/infrastructure/cert-manager-issuers
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: noah
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Flux substitutes ${DOMAIN} (and any other key) into the manifests at apply
  # time from the cluster-vars ConfigMap, seeded by the flux-bootstrap Ansible
  # role. Keeps the committed manifests domain-agnostic.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  timeout: 5m
  wait: true
