---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: noah
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/Engelnicolas/NOAH
  ignore: |
    # Ignore everything outside gitops/ to avoid spurious reconciliations
    /*
    !/gitops/
