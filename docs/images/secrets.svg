<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">Where NOAH keeps its secrets</title>
  <desc id="d">Cluster secrets are encrypted to the cluster Age key in the canonical store and applied to the cluster out of band; the compute node can read them by design. Garage administration secrets are encrypted to a second Age key that never reaches any node; the canonical store refuses them. Both identities are backed up offline, on separate media. Git holds no secret.</desc>
  <defs>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22D3EE"/>
    </marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1280" height="500" rx="28" fill="#0B1220"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Cluster domain -->
    <g>
      <rect x="40" y="40" width="500" height="340" rx="20" fill="#062A33" stroke="#22D3EE" stroke-width="2"/>
      <text x="64" y="80" font-size="22" font-weight="800" fill="#FFFFFF">Cluster secrets</text>
      <text x="64" y="104" font-size="14" fill="#A5F3FC">readable from the compute node, by design</text>

      <rect x="64" y="126" width="200" height="56" rx="12" fill="#0B1220" stroke="#22D3EE"/>
      <text x="164" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Age/keys.txt</text>
      <text x="164" y="170" text-anchor="middle" font-size="12" fill="#9CA3AF">cluster identity</text>
      <path d="M266 154H306" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#aCyan)"/>
      <rect x="310" y="126" width="206" height="56" rx="12" fill="#0B1220" stroke="#22D3EE"/>
      <text x="413" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">canonical-secrets.enc.yaml</text>
      <text x="413" y="170" text-anchor="middle" font-size="12" fill="#9CA3AF">Secrets/ · SOPS</text>

      <g font-size="14" fill="#D1D5DB">
        <text x="64" y="214">Application passwords, OIDC client secrets,</text>
        <text x="64" y="234">Cloudflare token, DKIM key, S3 consumption keys</text>
      </g>
      <path d="M413 186V258" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#aCyan)"/>
      <rect x="64" y="262" width="452" height="96" rx="12" fill="#0B1220" stroke="#374151"/>
      <text x="84" y="290" font-size="15" font-weight="700" fill="#FFFFFF">Applied to the cluster out of band</text>
      <text x="84" y="314" font-size="14" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cluster bootstrap · secrets apply</text>
      <text x="84" y="336" font-size="14" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">secrets rotate --apply</text>
    </g>

    <!-- Garage admin domain -->
    <g>
      <rect x="580" y="40" width="400" height="340" rx="20" fill="#1E1533" stroke="#A78BFA" stroke-width="2"/>
      <text x="604" y="80" font-size="22" font-weight="800" fill="#FFFFFF">Garage administration</text>
      <text x="604" y="104" font-size="14" fill="#DDD6FE">never transmitted to any node</text>

      <rect x="604" y="126" width="160" height="56" rx="12" fill="#0F0A1F" stroke="#A78BFA"/>
      <text x="684" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">garage-admin.txt</text>
      <text x="684" y="170" text-anchor="middle" font-size="12" fill="#9CA3AF">Age/ · 2nd identity</text>
      <path d="M766 154H790" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#aViolet)"/>
      <rect x="794" y="126" width="164" height="56" rx="12" fill="#0F0A1F" stroke="#A78BFA"/>
      <text x="876" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">garage-admin.enc.yaml</text>
      <text x="876" y="170" text-anchor="middle" font-size="12" fill="#9CA3AF">Secrets/ · SOPS</text>

      <g font-size="14" fill="#D1D5DB">
        <text x="604" y="214">Node SSH key, rpc_secret, admin token,</text>
        <text x="604" y="234">owner S3 key, cloud credentials,</text>
        <text x="604" y="254">OpenTofu state passphrase</text>
      </g>
      <rect x="604" y="278" width="352" height="80" rx="12" fill="#0F0A1F" stroke="#374151"/>
      <text x="624" y="306" font-size="14" fill="#DDD6FE">The canonical store refuses these keys</text>
      <text x="624" y="326" font-size="14" fill="#DDD6FE">(AdminSecretLeakError). Used only from</text>
      <text x="624" y="346" font-size="14" fill="#DDD6FE">the workstation, through ProxyJump.</text>
    </g>

    <!-- Escrow -->
    <g>
      <rect x="1020" y="40" width="220" height="340" rx="20" fill="#111827" stroke="#374151"/>
      <text x="1044" y="80" font-size="22" font-weight="800" fill="#FFFFFF">Escrow</text>
      <text x="1044" y="104" font-size="14" fill="#9CA3AF">outside the repository</text>
      <g fill="none" stroke="#E5E7EB" stroke-width="3">
        <rect x="1086" y="160" width="88" height="66" rx="8"/>
        <path d="M1108 160v-14a22 22 0 0 1 44 0v14"/>
      </g>
      <circle cx="1130" cy="188" r="7" fill="#E5E7EB"/>
      <path d="M1130 194v14" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
      <g font-size="14" fill="#D1D5DB">
        <text x="1044" y="250">Offline copies of both</text>
        <text x="1044" y="270">identities and stores,</text>
        <text x="1044" y="290"><tspan font-weight="700" fill="#FFFFFF">on separate media.</tspan></text>
        <text x="1044" y="322" fill="#9CA3AF">Lose an identity and</text>
        <text x="1044" y="342" fill="#9CA3AF">what it protects is gone.</text>
      </g>
    </g>

    <!-- Git -->
    <rect x="40" y="410" width="1200" height="56" rx="14" fill="#111827" stroke="#374151"/>
    <text x="64" y="444" font-size="16" font-weight="700" fill="#FFFFFF">Git holds no secret.</text>
    <text x="240" y="444" font-size="15" fill="#9CA3AF">No <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#D1D5DB">kind: Secret</tspan> under gitops/, no secret in infra-inventory.json, the OpenTofu state is encrypted, Age/ and Secrets/ are gitignored.</text>
  </g>
</svg>
