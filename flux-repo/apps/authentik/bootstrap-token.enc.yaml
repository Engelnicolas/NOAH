---
# PLACEHOLDER — encrypt with `sops --encrypt --in-place` before commit.
# Used by the hubble-auth provisioner Job to authenticate against the
# Authentik API. Must match authentik.bootstrap_token in
# values-secret.enc.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-bootstrap-token
  namespace: authentik
type: Opaque
stringData:
  AUTHENTIK_TOKEN: REPLACE_WITH_BOOTSTRAP_TOKEN
  AUTHENTIK_URL: https://auth.example.com
