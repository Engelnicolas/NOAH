---
# PLACEHOLDER — encrypt with `sops --encrypt --in-place` before commit.
# `noah secrets push --service authentik` (v0.0.9) writes the encrypted
# values file directly into the GitOps repository.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-values
  namespace: authentik
type: Opaque
stringData:
  values.yaml: |
    authentik:
      secret_key: REPLACE_WITH_50_CHAR_SECRET
      bootstrap_password: REPLACE_WITH_ADMIN_PASSWORD
      bootstrap_token: REPLACE_WITH_BOOTSTRAP_TOKEN
      bootstrap_email: admin@example.com
      postgresql:
        password: REPLACE_WITH_POSTGRES_PASSWORD
    postgresql:
      auth:
        password: REPLACE_WITH_POSTGRES_PASSWORD
        postgresPassword: REPLACE_WITH_POSTGRES_ROOT_PASSWORD
