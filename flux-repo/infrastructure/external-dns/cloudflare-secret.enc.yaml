---
# PLACEHOLDER — encrypt with `sops --encrypt --in-place` before commit.
# Same Cloudflare token as cert-manager (DNS-01 + DNS sync share the
# same scopes). Storing it twice is intentional — cross-namespace
# Secret references would force ESO or a hand-rolled controller.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
type: Opaque
stringData:
  api-token: REPLACE_WITH_CLOUDFLARE_TOKEN
