---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 30m
  chart:
    spec:
      chart: nextcloud
      version: '>=9.2.0 <10.0.0'
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nextcloud:
      host: "nextcloud.${DOMAIN}"
      # Admin credentials from the nextcloud-app Secret (delivered out-of-band
      # by the app-secrets role / `noah secrets apply`).
      existingSecret:
        enabled: true
        secretName: nextcloud-app
        usernameKey: admin-username
        passwordKey: admin-password
      # Reverse-proxy correctness behind nginx-ingress (TLS terminates there).
      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'overwriteprotocol' => 'https',
            'overwritehost' => 'nextcloud.${DOMAIN}',
            'overwrite.cli.url' => 'https://nextcloud.${DOMAIN}',
            'trusted_proxies' => array('10.0.0.0/8', '127.0.0.1'),
          );
      # OIDC client credentials for the before-starting hook below (from the
      # nextcloud-oidc Secret, same values the provision Job registers in
      # Authentik).
      extraEnv:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-oidc
              key: OIDC_CLIENT_SECRET
      # Runs on EVERY container start (after any install/upgrade), executed by
      # the entrypoint via run_as as www-data with env intact. Idempotently
      # (re)installs user_oidc and (re)registers Authentik as the OIDC provider
      # with the CURRENT client secret from env, so `noah secrets rotate`
      # propagates on the next pod restart (the old post-installation hook ran
      # only once at install, freezing the first secret). Default user_oidc
      # scopes are "openid email profile" — exactly what the Authentik provider
      # grants. Local password login stays enabled (decision: OIDC + local
      # accounts; the admin account is the break-glass).
      #
      # Notes:
      #  - $${OIDC_CLIENT_ID}/$${OIDC_CLIENT_SECRET} are escaped ($$) so Flux's
      #    postBuild substitution leaves them for the shell to expand from env;
      #    ${DOMAIN} stays a single $ so Flux DOES substitute it.
      #  - The entrypoint treats a non-zero hook as fatal (exit 1), so every step
      #    is guarded and the script always exits 0 — a transient error (DB not
      #    ready, app store unreachable) must never block Nextcloud from starting.
      #  - --unique-uid=0 --mapping-uid=preferred_username gives readable, stable
      #    usernames instead of a hashed sub. Do NOT change this mapping once real
      #    users exist: a different uid mapping orphans their accounts.
      hooks:
        before-starting: |
          #!/bin/sh
          php /var/www/html/occ app:install user_oidc >/dev/null 2>&1 || true
          php /var/www/html/occ app:enable user_oidc || true
          php /var/www/html/occ user_oidc:provider authentik \
            --clientid="$${OIDC_CLIENT_ID}" \
            --clientsecret="$${OIDC_CLIENT_SECRET}" \
            --discoveryuri="https://auth.${DOMAIN}/application/o/nextcloud/.well-known/openid-configuration" \
            --unique-uid=0 \
            --mapping-uid=preferred_username || true
          exit 0
    internalDatabase:
      enabled: false
    # Bundled PostgreSQL subchart is enabled below; the chart still reads the
    # application-side DB credentials from externalDatabase.existingSecret
    # (POSTGRES_USER/POSTGRES_PASSWORD env), so both must point at the same
    # Secret keys.
    externalDatabase:
      type: postgresql
      existingSecret:
        enabled: true
        secretName: nextcloud-app
        usernameKey: db-username
        passwordKey: db-password
    postgresql:
      enabled: true
      global:
        postgresql:
          auth:
            username: nextcloud
            database: nextcloud
            existingSecret: nextcloud-app
            secretKeys:
              adminPasswordKey: db-root-password
              userPasswordKey: db-password
      primary:
        persistence:
          enabled: true
          size: 8Gi
    redis:
      enabled: true
      # architecture: standalone is the chart default — single node, no replicas.
      auth:
        enabled: true
        existingSecret: nextcloud-app
        existingSecretPasswordKey: redis-password
    persistence:
      enabled: true
      size: 50Gi
    # First install (download + occ install + user_oidc) takes several
    # minutes; the startup probe keeps the liveness probe from killing the pod
    # during it (30 × 10s).
    startupProbe:
      enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        # CalDAV/CardDAV .well-known redirects (Nextcloud requirement).
        nginx.ingress.kubernetes.io/server-snippet: |-
          location = /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
          }
          location = /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
          }
      tls:
        - secretName: nextcloud-tls
          hosts: ["nextcloud.${DOMAIN}"]
