---
# Renders the declarative Stalwart v0.16 configuration as a `stalwart-cli apply`
# plan (NDJSON). Run by the stalwart-config Job's init container, which pipes
# the output to a file the cli container then applies. Kept as a script (not a
# static plan) because the DKIM key and TLS certificate are secret material
# injected at run time from mounted Secrets — nothing key-derived is committed.
#
# Every op uses `matchOn` so the plan is idempotent (re-runs reconcile in place).
# The two non-obvious keys: DkimSignature matches on `selector` only (its stored
# `domainId` is a resolved id, never the "#dom0" plan reference), and Tracer
# matches on `@type`. In-plan references must be declared before use, hence the
# Directory -> Domain -> DKIM ordering.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-apply-plan
  namespace: stalwart
data:
  render_plan.py: |
    #!/usr/bin/env python3
    """Render the Stalwart v0.16 apply plan (NDJSON) from mounted secrets + DOMAIN."""
    import json
    import os

    DOMAIN = os.environ["DOMAIN"]
    # Authentik per-application OIDC issuer (issuer_mode: per_provider); the
    # provider is registered under the "stalwart" application slug.
    ISSUER = f"https://auth.{DOMAIN}/application/o/stalwart/"
    # Authentik's bootstrap admin, same identity the provisioner puts in the
    # `admin` group (see authentik_provisioner.py --admin-user).
    ADMIN_USER = "akadmin"

    with open("/secrets/app/DKIM_PRIVATE_KEY") as f:
        dkim_key = f.read()
    with open("/secrets/tls/tls.crt") as f:
        tls_crt = f.read()
    with open("/secrets/tls/tls.key") as f:
        tls_key = f.read()

    def listener(name, port, protocol, use_tls, implicit):
        return {"@type": "upsert", "object": "NetworkListener", "matchOn": ["name"],
                "value": {name: {"name": name, "protocol": protocol,
                                 "bind": {f"[::]:{port}": True},
                                 "useTls": use_tls, "tlsImplicit": implicit}}}

    ops = [
        # stdout logging for `kubectl logs` (matchOn @type keeps it idempotent)
        {"@type": "upsert", "object": "Tracer", "matchOn": ["@type"],
         "value": {"trc0": {"@type": "Stdout", "enable": True, "level": "info",
                            "ansi": False, "buffered": False, "lossy": False,
                            "multiline": False}}},
        # references must be defined BEFORE use: Directory -> Domain -> DKIM
        # claimGroups makes Stalwart read group membership from the token's
        # `groups` claim (populated by Authentik's default `profile` mapping).
        {"@type": "upsert", "object": "Directory", "matchOn": ["description"],
         "value": {"oidc0": {"@type": "Oidc", "description": "Authentik",
                             "issuerUrl": ISSUER,
                             "claimUsername": "preferred_username",
                             "claimName": "name", "claimGroups": "groups",
                             "usernameDomain": DOMAIN,
                             "requireScopes": {"openid": True, "email": True}}}},
        {"@type": "upsert", "object": "Domain", "matchOn": ["name"],
         "value": {"dom0": {"name": DOMAIN, "isEnabled": True,
                            "directoryId": "#oidc0",
                            "dkimManagement": {"@type": "Manual"},
                            "dnsManagement": {"@type": "Manual"},
                            "certificateManagement": {"@type": "Manual"}}}},
        {"@type": "upsert", "object": "DkimSignature", "matchOn": ["selector"],
         "value": {"dkim0": {"@type": "Dkim1RsaSha256", "domainId": "#dom0",
                             "selector": "stalwart",
                             "canonicalization": "relaxed/relaxed",
                             "privateKey": {"@type": "Text", "secret": dkim_key}}}},
        # SSO: authenticate every principal against Authentik instead of the
        # internal directory. The break-glass admin is unaffected — it is pinned
        # by STALWART_RECOVERY_ADMIN on the StatefulSet and bypasses directories.
        # `update` (not `upsert`): Authentication is a singleton.
        {"@type": "update", "object": "Authentication",
         "value": {"directoryId": "#oidc0"}},
        # Grant the Authentik admin the built-in System Administrator role (id
        # "e", seeded at bootstrap). It must sit on the account itself: Stalwart
        # does NOT inherit roles through group membership, so belonging to an
        # `admin` group is not enough. Pre-creating the account here means the
        # role is already in place the first time the identity signs in.
        {"@type": "upsert", "object": "Account", "matchOn": ["name"],
         "value": {"acc0": {"@type": "User", "name": ADMIN_USER,
                            "domainId": "#dom0",
                            "roles": {"@type": "Custom",
                                      "roleIds": {"e": True}}}}},
        # Announce a FQDN in the SMTP greeting instead of the pod hostname
        # ("stalwart-0"). Receivers check that the HELO name is a FQDN
        # consistent with the sending IP's PTR, so this must match the reverse
        # DNS requested for the node. defaultDomainId is set alongside because
        # the singleton refuses to validate without it.
        {"@type": "update", "object": "SystemSettings",
         "value": {"defaultHostname": f"mail.{DOMAIN}", "defaultDomainId": "#dom0"}},
        listener("http", 8080, "http", False, False),
        listener("smtp", 25, "smtp", True, False),
        listener("submission", 587, "smtp", True, False),
        listener("submissions", 465, "smtp", True, True),
        listener("imap", 143, "imap", True, False),
        listener("imaps", 993, "imap", True, True),
        {"@type": "upsert", "object": "Certificate", "matchOn": ["certificate"],
         "value": {"cert0": {"certificate": {"@type": "Text", "value": tls_crt},
                             "privateKey": {"@type": "Text", "secret": tls_key}}}},
        # MUST stay last. A running Stalwart does not pick up settings written
        # to its datastore — the auth directory and the SMTP hostname both stay
        # stale until reloaded. Without this the Job "succeeds" while the server
        # keeps serving the previous configuration, and only a pod restart fixes
        # it. Reloading in-process avoids that, and avoids bouncing the MTA.
        {"@type": "create", "object": "Action",
         "value": {"act0": {"@type": "ReloadSettings"}}},
    ]

    for op in ops:
        print(json.dumps(op, ensure_ascii=False))
