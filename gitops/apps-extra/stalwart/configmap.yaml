---
# Stalwart v0.16 on-disk configuration. Deployed as raw manifests (no official
# Helm chart; community charts are 0.x on personal registries — spec §4.1
# fallback).
#
# Unlike v0.15 (a full declarative config.toml), v0.16 keeps ONLY the datastore
# definition on disk. Everything else — listeners, domain, OIDC directory, DKIM
# signature, TLS certificate — lives inside the datastore as JMAP objects and is
# reconciled by the stalwart-config provision Job via `stalwart-cli apply`
# (see apply-plan-configmap.yaml / provision-config-job.yaml).
#
# Because config.json is present at startup, the server boots straight into
# normal mode (no bootstrap-mode dance) with default listeners, then the Job
# reconciles the NOAH configuration over the management API on port 8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: stalwart
data:
  # DataStore object: RocksDB rooted at the persistent volume mounted at
  # /var/lib/stalwart (the v0.16 image's data mount point; UID 2000).
  config.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart"}
