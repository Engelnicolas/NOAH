---
# Registers the `stalwart` OAuth2/OIDC client in Authentik. Its access tokens
# are what mail clients present to Stalwart over OAUTHBEARER/XOAUTH2 (the
# [directory."oidc"] block in configmap.yaml validates them against the
# Authentik userinfo endpoint). Idempotent — re-runs PATCH the existing
# provider/application.
#
# The redirect URI is a placeholder for clients driving an authorization-code
# flow (Stalwart itself never receives a browser redirect in v0.15); tokens
# obtained via any grant of this client work for OAUTHBEARER.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-provision-stalwart
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provisioner
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              export HOME=/tmp
              pip install --quiet --user requests
              python /scripts/authentik_provisioner.py \
                --service stalwart \
                --type oidc \
                --external-host "https://mail.${DOMAIN}" \
                --redirect-uri "https://mail.${DOMAIN}/auth/callback"
          envFrom:
            # AUTHENTIK_TOKEN (bootstrap admin token).
            - secretRef:
                name: authentik-bootstrap-token
            # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET for the registered client.
            - secretRef:
                name: stalwart-oidc-provision
          env:
            - name: AUTHENTIK_URL
              value: "http://authentik-server.authentik.svc.cluster.local"
            - name: AUTHENTIK_EXTERNAL_URL
              value: "https://auth.${DOMAIN}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: provisioner
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: provisioner
          configMap:
            # Static (unhashed) copy of the shared provisioner script — see
            # the note in gitops/apps-extra/nextcloud/provision-job.yaml.
            name: authentik-provisioner-script-static
            defaultMode: 0755
