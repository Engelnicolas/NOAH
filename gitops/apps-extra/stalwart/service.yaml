---
# ClusterIP service for the HTTP listener only (webadmin + JMAP), consumed by
# ingress.yaml. Mail ports are exposed via hostPort on the pod, not here.
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: stalwart
spec:
  selector:
    app: stalwart
  ports:
    - name: http
      port: 80
      targetPort: http
