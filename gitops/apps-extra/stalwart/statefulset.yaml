---
# Stalwart mail server, single replica. Mail ports (25/587/465/143/993) bind
# the node directly via hostPort — nginx-ingress is L7/HTTP-only and this
# single-node EC2 sits behind a 1:1 NAT EIP (same rationale as the hostPort
# block in gitops/infrastructure/nginx-ingress/helmrelease.yaml). hostPort
# also means two replicas cannot coexist on one node; a StatefulSet updates
# pods by delete-then-create, so no maxSurge deadlock is possible.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
spec:
  serviceName: stalwart
  replicas: 1
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      # The v0.16 image runs as UID/GID 2000; fsGroup makes the data PVC
      # group-writable so RocksDB can initialise under /var/lib/stalwart.
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16.13
          ports:
            - name: smtp
              containerPort: 25
              hostPort: 25
            - name: submission
              containerPort: 587
              hostPort: 587
            - name: submissions
              containerPort: 465
              hostPort: 465
            - name: imap
              containerPort: 143
              hostPort: 143
            - name: imaps
              containerPort: 993
              hostPort: 993
            # webadmin + JMAP: cluster-internal only, exposed via nginx-ingress.
            - name: http
              containerPort: 8080
          env:
            # Break-glass administrator for the management API / web UI (OIDC
            # users authenticate with tokens, not passwords). Replaces v0.15's
            # [authentication.fallback-admin]. ADMIN_SECRET must be listed first
            # so the $(ADMIN_SECRET) reference below resolves.
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: stalwart-app
                  key: ADMIN_SECRET
            - name: STALWART_RECOVERY_ADMIN
              value: "admin:$(ADMIN_SECRET)"
          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
            # config.json (datastore definition only) is read-only; everything
            # else is reconciled into the datastore by the stalwart-config Job.
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: stalwart-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
