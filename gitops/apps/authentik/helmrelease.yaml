---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: '>=2026.8.5 <2027.0.0'
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: authentik-values
      valuesKey: values.yaml
  values:
    # Non-secret defaults; secrets (admin password, postgres password,
    # bootstrap token, secret_key) are provided by authentik-values.
    # Outgoing mail through the in-cluster Stalwart relay (no auth, no TLS:
    # the hop never leaves the cluster). Stalwart is opt-in; without it this
    # host does not resolve and Authentik simply cannot send, as before.
    authentik:
      email:
        host: stalwart.stalwart.svc.cluster.local
        port: 2525
        use_tls: false
        use_ssl: false
        from: "Authentik <authentik@${DOMAIN}>"
    server:
      replicas: 1
    worker:
      replicas: 1
    postgresql:
      enabled: true
    redis:
      enabled: true
