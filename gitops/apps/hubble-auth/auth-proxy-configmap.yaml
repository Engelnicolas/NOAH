---
# Rewrites Host: hubble.${DOMAIN} so Authentik's embedded outpost
# can match the forward-auth request to the hubble-proxy provider.
# nginx-ingress hardcodes Host to the upstream service hostname in the
# auth_request block; this proxy transforms it to the application host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-auth-proxy-config
  namespace: kube-system
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        location / {
          proxy_pass http://authentik-server.authentik.svc.cluster.local;
          proxy_pass_request_headers on;
          proxy_set_header Host hubble.${DOMAIN};
        }
      }
    }
