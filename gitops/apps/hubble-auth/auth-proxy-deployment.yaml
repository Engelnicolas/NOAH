---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth-proxy
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-auth-proxy
  template:
    metadata:
      labels:
        app: hubble-auth-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Unprivileged nginx image: runs as UID 101 and listens on 8080, so it
          # needs neither root nor the NET_BIND_SERVICE capability, and works
          # with a read-only root filesystem (temp/pid dirs point at /tmp).
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: hubble-auth-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth-proxy
  namespace: kube-system
spec:
  selector:
    app: hubble-auth-proxy
  ports:
    - port: 80
      targetPort: 8080
