---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth-proxy
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-auth-proxy
  template:
    metadata:
      labels:
        app: hubble-auth-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: hubble-auth-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth-proxy
  namespace: kube-system
spec:
  selector:
    app: hubble-auth-proxy
  ports:
    - port: 80
      targetPort: 80
