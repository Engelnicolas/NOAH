---
# Hubble UI ingress, gated by Authentik's outpost via the
# `auth_request` annotation. Without this ingress, Hubble UI has no
# external entry point — Cilium's chart-level ingress is disabled.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-url: "http://hubble-auth-proxy.kube-system.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    # Base URL only, no query string: ingress-nginx (>=1.9, CVE-2023-5044
    # hardening) rejects auth-signin values containing nginx runtime vars
    # ($scheme/$http_host/$escaped_request_uri) — it silently drops the whole
    # annotation, so a 401 from the outpost is returned raw instead of
    # redirecting to login. The controller appends ?rd=<original-url> itself
    # (buildAuthSignURL), so the redirect-back is preserved. ${DOMAIN} is left
    # single-$ so Flux substitutes it from the cluster-vars ConfigMap.
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.${DOMAIN}/outpost.goauthentik.io/start"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
spec:
  ingressClassName: nginx
  rules:
    - host: "hubble.${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
  tls:
    - secretName: hubble-tls
      hosts: ["hubble.${DOMAIN}"]
