---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-provisioner-script
  namespace: authentik
data:
  authentik_provisioner.py: |
    #!/usr/bin/env python3
    """
    Registers a service as an Authentik Proxy Provider (forward-auth mode).
    Usage: authentik_provisioner.py --service <name> --type proxy --external-host <url>
    Reads AUTHENTIK_URL and AUTHENTIK_TOKEN from environment.
    Idempotent: re-running is a no-op if the provider/app already exist.
    """
    import argparse
    import os
    import sys
    import requests
    import urllib3

    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)


    def headers():
        return {
            "Authorization": f"Bearer {os.environ['AUTHENTIK_TOKEN']}",
            "Content-Type": "application/json",
        }


    def api(method, path, **kwargs):
        base = os.environ["AUTHENTIK_URL"].rstrip("/")
        r = getattr(requests, method)(
            f"{base}/api/v3{path}", headers=headers(), verify=False, timeout=30, **kwargs
        )
        if not r.ok:
            print(f"ERROR {method.upper()} {path}: {r.status_code} {r.text}", file=sys.stderr)
            sys.exit(1)
        return r.json()


    def find_or_create(path, key, value, payload):
        for item in api("get", path, params={"search": value}).get("results", []):
            if item.get(key) == value:
                print(f"[INFO] Already exists: {value}")
                return item
        print(f"[INFO] Creating: {value}")
        return api("post", path, json=payload)


    def default_flow(designation, preferred_slug_fragment):
        flows = api("get", "/flows/instances/", params={"designation": designation})
        results = flows.get("results", [])
        for flow in results:
            if preferred_slug_fragment in flow["slug"]:
                return flow["pk"]
        if results:
            return results[0]["pk"]
        print(f"[ERROR] No {designation} flow found", file=sys.stderr)
        sys.exit(1)


    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument("--service", required=True)
        parser.add_argument("--type", required=True)
        parser.add_argument("--external-host", required=True)
        args = parser.parse_args()

        auth_flow = default_flow("authorization", "default-provider-authorization")
        invalidation_flow = default_flow("invalidation", "default-provider-invalidation")

        # 1. Proxy Provider
        provider = find_or_create(
            "/providers/proxy/",
            "name",
            f"{args.service}-proxy",
            {
                "name": f"{args.service}-proxy",
                "authorization_flow": auth_flow,
                "invalidation_flow": invalidation_flow,
                "mode": "forward_single",
                "external_host": args.external_host,
            },
        )
        provider_pk = provider["pk"]
        print(f"[INFO] Provider pk={provider_pk}")

        # 2. Application
        app = find_or_create(
            "/core/applications/",
            "slug",
            args.service,
            {
                "name": args.service.capitalize(),
                "slug": args.service,
                "provider": provider_pk,
            },
        )
        print(f"[INFO] Application slug={app['slug']}")

        # 3. Bind provider to the embedded outpost
        outposts = api(
            "get",
            "/outposts/instances/",
            params={"managed": "goauthentik.io/outposts/embedded"},
        )
        if outposts["results"]:
            outpost = outposts["results"][0]
            providers = outpost.get("providers", [])
            if provider_pk not in providers:
                providers.append(provider_pk)
                api("patch", f"/outposts/instances/{outpost['pk']}/", json={"providers": providers})
                print("[INFO] Provider added to embedded outpost")
            else:
                print("[INFO] Provider already in embedded outpost")
        else:
            print("[WARNING] No embedded outpost found — skipping outpost binding", file=sys.stderr)

        print("[SUCCESS] Provisioning complete")


    if __name__ == "__main__":
        main()
