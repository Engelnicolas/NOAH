---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik
  - headlamp
  - hubble-auth

# Shared provisioner script, generated here (not as a static ConfigMap) so its
# content hash is appended to the name. When the script changes, the generated
# name changes, which changes the volume reference in BOTH provisioning Jobs
# (authentik-provision-hubble and -headlamp) — combined with the
# kustomize.toolkit.fluxcd.io/force annotation on those Jobs, FluxCD then
# deletes and recreates them so the new script actually runs. A static
# ConfigMap would leave the Jobs untouched (their spec wouldn't change) and the
# edit would never re-provision. Generated at this aggregate level so the name
# rewrite reaches the Jobs in both the headlamp/ and hubble-auth/ subdirs.
configMapGenerator:
  - name: authentik-provisioner-script
    namespace: authentik
    files:
      - authentik_provisioner.py
  # Same script under a static (unhashed) name, for the provisioning Jobs in
  # gitops/apps-extra/ — a separate Flux Kustomization cannot resolve the
  # hashed name above (kustomize only rewrites references within one build).
  # Content still updates in place on script edits; only the automatic
  # Job re-trigger is limited to the apps/ Jobs.
  - name: authentik-provisioner-script-static
    namespace: authentik
    options:
      disableNameSuffixHash: true
    files:
      - authentik_provisioner.py
