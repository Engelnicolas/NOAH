---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: noah
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/Engelnicolas/NOAH
  ignore: |
    # Ignore everything outside gitops/ to avoid spurious reconciliations
    /*
    !/gitops/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/clusters/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: noah
