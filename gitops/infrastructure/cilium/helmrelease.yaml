---
# Cilium replaces flannel + kube-proxy (which K3s was started with
# --flannel-backend=none and --disable-network-policy). Hubble UI is
# enabled but exposed only via the cilium-auth Authentik proxy, at
# cilium.${DOMAIN} — no unauthenticated ingress.
#
# The network baseline (default-deny + allows) lives in gitops/network-policies/,
# reconciled last by its own Flux Kustomization.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: '>=1.20.4 <2.0.0'
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    kubeProxyReplacement: true
    # k8sServiceHost / k8sServicePort are patched per-cluster via
    # postBuild substitutions in clusters/production/infrastructure.yaml
    # if you run multiple clusters from the same repo.
    k8sServiceHost: "127.0.0.1"
    k8sServicePort: 6443
    operator:
      replicas: 1
    # Pod range, explicit and disjoint from every infrastructure prefix.
    # Cilium's default (10.0.0.0/8) contains the AWS VPC (10.0.0.0/16), hence
    # the Garage subnet the egress policies target by CIDR. Must stay identical
    # to Ansible/roles/cilium-preflight, which allocates it at bootstrap; it
    # cannot be changed on a live cluster (rebuild).
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
        clusterPoolIPv4MaskSize: 24
    # L7 proxy (Envoy): required for HTTP visibility and enforcement. Chart
    # default is true; explicit so the intent is readable.
    l7Proxy: true
    # AUDIT MODE: policy verdicts are logged (hubble observe --verdict AUDIT),
    # never enforced. Switching to enforce is a commit that sets this to false,
    # only after the audit window shows no legitimate flow would be dropped.
    # Never flip it with `cilium config`: this HelmRelease owns cilium-config
    # and would silently restore the committed value within its interval.
    policyAuditMode: true
    # bpf.masquerade is deliberately NOT set (chart default: false). With
    # kubeProxyReplacement already true, enabling it would turn on eBPF host
    # routing, which bypasses netfilter and silently cuts the Garage nodes'
    # egress through this node (Ansible role compute-nat refuses to run then).
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
        # No ingress at the chart level — exposed via cilium-auth.
        ingress:
          enabled: false
      # L7 metrics: feed the Hubble UI service map (and Grafana later).
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http:exemplars=true;labelsContext=source_namespace,destination_namespace
    ingressController:
      enabled: false
    gatewayAPI:
      enabled: false
