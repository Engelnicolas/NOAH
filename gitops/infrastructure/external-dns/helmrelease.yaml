---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: '>=1.14.0 <2.0.0'
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    sources:
      - service
      - ingress
      # DNSEndpoint CRs (mail MX/SPF/DKIM/DMARC records for Stalwart). The
      # DNSEndpoint CRD is vendored in dnsendpoint-crd.yaml — the chart does
      # not ship it.
      - crd
    policy: sync
    txtOwnerId: noah
    # Ownership TXT records must live INSIDE the zone. The default naming
    # (`<type>-<name>`) puts the apex ones at `mx-noah-infra.com` /
    # `txt-noah-infra.com`, which belong to `.com`, not to the zone — Cloudflare
    # rejects them ("DNS name is invalid"), so external-dns can never own an
    # apex record and silently skips the MX and SPF published by the crd source.
    # The trailing dot turns the prefix into a label, keeping every ownership
    # record in-zone (`mx-edns.noah-infra.com`); %{record_type} keeps the MX and
    # TXT owners from colliding on the same apex name.
    txtPrefix: "%{record_type}-edns."
    # A/CNAME (+ TXT ownership) are the defaults; MX and standalone TXT are
    # needed for the mail records published via the crd source.
    managedRecordTypes:
      - A
      - AAAA
      - CNAME
      - TXT
      - MX
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
