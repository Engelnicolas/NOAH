---
# Rendered for network.mode=private (see values.yaml).
# For mode=public, replace the fromCIDR block with:
#   fromEntities:
#     - world
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: noah-bootstrap-allowlist
spec:
  description: "Restrict Gateway ingress to the operator tailnet during bootstrap"
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: kube-system
      app.kubernetes.io/name: cilium-gateway
  ingress:
    - fromCIDR:
        - 100.64.0.0/10   # Tailscale CGNAT, RFC 6598
