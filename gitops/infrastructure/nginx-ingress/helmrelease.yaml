---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: '>=4.9.0 <5.0.0'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      ingressClassResource:
        name: nginx
        enabled: true
        default: false
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        proxy-body-size: "0"
