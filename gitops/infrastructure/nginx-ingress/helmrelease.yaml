---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: '>=4.9.0 <5.0.0'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      ingressClassResource:
        name: nginx
        enabled: true
        default: false
      # Single-node EC2 behind AWS 1:1 NAT: bind the node's :80/:443 directly so
      # inbound traffic to the instance's public IP (EIP) is delivered to nginx.
      # Avoids Cilium LB-IPAM/L2, which cannot announce a public IP on AWS.
      hostPort:
        enabled: true
      service:
        type: ClusterIP
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        proxy-body-size: "0"
        allow-snippet-annotations: "true"
        annotations-risk-level: "Critical"
