---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: '>=4.9.0 <5.0.0'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      ingressClassResource:
        name: nginx
        enabled: true
        default: false
      # Single-node EC2 behind AWS 1:1 NAT: bind the node's :80/:443 directly so
      # inbound traffic to the instance's public IP (EIP) is delivered to nginx.
      # Avoids Cilium LB-IPAM/L2, which cannot announce a public IP on AWS.
      hostPort:
        enabled: true
      service:
        type: ClusterIP
      # With a ClusterIP service there is no LoadBalancer IP for nginx to write
      # into each Ingress' status — external-dns would otherwise publish the
      # cluster-internal service IP. Disable publishService and pin the node's
      # public IP (EC2 EIP) so external-dns creates records pointing at the EIP.
      # The address below is filled in by `noah setup gitops --node-ip`.
      publishService:
        enabled: false
      extraArgs:
        publish-status-address: 15.188.112.171
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        proxy-body-size: "0"
        allow-snippet-annotations: "true"
        annotations-risk-level: "Critical"
