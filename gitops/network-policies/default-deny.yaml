---
# Default-deny for every endpoint, both directions.
#
# The empty rule `- {}` is what selects a direction; an empty LIST
# (`ingress: []`) has no rule and would leave the policy inert. enableDefaultDeny
# is set explicitly so the intent does not depend on that inference.
#
# Host -> pod traffic (kubelet probes) stays allowed: hostFirewall is off.
# Nothing may ever allow 169.254.169.254 (cloud metadata) or, towards the
# Garage segment, ports 22, 3901 and 3903: their absence IS the measure.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-all
spec:
  description: "NOAH baseline - any flow not explicitly allowed is denied"
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - {}
